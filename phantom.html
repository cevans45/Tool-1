<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .app[aria-label="Phantom"] { background: #000; }
        .app[aria-label="Phantom"] .control-panel {
            background: rgba(0,0,0,0.92);
            border-color: #222;
        }
        .app[aria-label="Phantom"] .panel-header { border-color: #333; }
        .app[aria-label="Phantom"] .panel-header h2 { color: #888; }
        .app[aria-label="Phantom"] .control-window summary { color: #777; }
        .app[aria-label="Phantom"] .control-window[open] summary { color: #ccc; }
        .app[aria-label="Phantom"] .control-row label { color: #666; }
        .app[aria-label="Phantom"] .param-value { color: #666; }
        .app[aria-label="Phantom"] .control-window { border-color: #222; }
        .app[aria-label="Phantom"] .select-input {
            background: #111; color: #ccc; border-color: #333;
        }
        .app[aria-label="Phantom"] .panel-button {
            background: transparent; color: #fff; border-color: #fff;
        }
        .app[aria-label="Phantom"] .panel-button:hover {
            background: #fff; color: #000;
        }
        .app[aria-label="Phantom"] .panel-button.is-active {
            background: #fff; color: #000;
        }
        .app[aria-label="Phantom"] .back-link { color: #666; }
        #phantom-wrap { flex:1; position:relative; overflow:hidden; }
        #phantom-wrap canvas { display:block; width:100%!important; height:100%!important; }
    </style>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header" style="background:#000;border-color:#222;">
            <a href="index.html" class="back-link" style="color:#666;">← Back to OVRT</a>
            <span class="tool-title" style="color:#888;">Phantom</span>
        </header>
        <div class="app" aria-label="Phantom">
            <div id="phantom-wrap"></div>
            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Phantom</h2>
                </header>
                <div class="panel-body">
                    <details class="control-window" open>
                        <summary>Figure</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Particles</label><input type="range" id="p-count" min="5" max="100" value="20" step="1"><span class="param-value" id="vp-count">20</span></div>
                            <div class="control-row"><label>Width</label><input type="range" id="p-width" min="5" max="100" value="40" step="1"><span class="param-value" id="vp-width">40</span></div>
                            <div class="control-row"><label>Height</label><input type="range" id="p-height" min="10" max="100" value="75" step="1"><span class="param-value" id="vp-height">75</span></div>
                            <div class="control-row"><label>Stretch</label><input type="range" id="p-stretch" min="0" max="100" value="50" step="1"><span class="param-value" id="vp-stretch">50</span></div>
                            <div class="control-row"><label>Mirror</label><input type="range" id="p-mirror" min="0" max="100" value="100" step="1"><span class="param-value" id="vp-mirror">100</span></div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Motion</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Speed</label><input type="range" id="p-speed" min="1" max="100" value="30" step="1"><span class="param-value" id="vp-speed">30</span></div>
                            <div class="control-row"><label>Ripple</label><input type="range" id="p-ripple" min="0" max="100" value="35" step="1"><span class="param-value" id="vp-ripple">35</span></div>
                            <div class="control-row"><label>Distortion</label><input type="range" id="p-distort" min="0" max="100" value="20" step="1"><span class="param-value" id="vp-distort">20</span></div>
                            <div class="control-row"><label>Shimmer</label><input type="range" id="p-shimmer" min="0" max="100" value="40" step="1"><span class="param-value" id="vp-shimmer">40</span></div>
                            <div class="control-row"><label>Pulse</label><input type="range" id="p-pulse" min="0" max="100" value="25" step="1"><span class="param-value" id="vp-pulse">25</span></div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Beams</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Count</label><input type="range" id="p-beams" min="0" max="12" value="5" step="1"><span class="param-value" id="vp-beams">5</span></div>
                            <div class="control-row"><label>Width</label><input type="range" id="p-bwidth" min="1" max="100" value="25" step="1"><span class="param-value" id="vp-bwidth">25</span></div>
                            <div class="control-row"><label>Brightness</label><input type="range" id="p-bbright" min="0" max="100" value="40" step="1"><span class="param-value" id="vp-bbright">40</span></div>
                            <div class="control-row"><label>Spread</label><input type="range" id="p-bspread" min="5" max="100" value="50" step="1"><span class="param-value" id="vp-bspread">50</span></div>
                        </section>
                    </details>

                    <details class="control-window">
                        <summary>Fracture</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Amount</label><input type="range" id="p-fracture" min="0" max="100" value="0" step="1"><span class="param-value" id="vp-fracture">0</span></div>
                            <div class="control-row"><label>Glitch</label><input type="range" id="p-glitch" min="0" max="100" value="0" step="1"><span class="param-value" id="vp-glitch">0</span></div>
                            <div class="control-row"><label>Vibration</label><input type="range" id="p-vibrate" min="0" max="100" value="0" step="1"><span class="param-value" id="vp-vibrate">0</span></div>
                            <div class="control-row"><label>Scanlines</label><input type="range" id="p-scan" min="0" max="100" value="15" step="1"><span class="param-value" id="vp-scan">15</span></div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Atmosphere</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Bloom</label><input type="range" id="p-bloom" min="0" max="100" value="20" step="1"><span class="param-value" id="vp-bloom">20</span></div>
                            <div class="control-row"><label>Brightness</label><input type="range" id="p-bright" min="5" max="100" value="25" step="1"><span class="param-value" id="vp-bright">25</span></div>
                            <div class="control-row"><label>Trail</label><input type="range" id="p-trail" min="0" max="100" value="60" step="1"><span class="param-value" id="vp-trail">60</span></div>
                            <div class="control-row"><label>Depth</label><input type="range" id="p-depth" min="0" max="100" value="40" step="1"><span class="param-value" id="vp-depth">40</span></div>
                            <div class="control-row color-row"><label>Color</label><input type="color" id="p-color" value="#ffffff"></div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }}
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    if (new URLSearchParams(location.search).get('preview') === '1') {
        document.body.classList.add('is-preview');
    }

    // ── Helpers ──────────────────────────────────────────
    const el = id => document.getElementById(id);
    const V = id => parseFloat(el(id)?.value ?? 50) / 100;
    const Vi = id => parseInt(el(id)?.value ?? 50, 10);

    // Slider readout
    document.querySelectorAll('.control-row input[type="range"]').forEach(inp => {
        const v = inp.parentElement.querySelector('.param-value');
        if (v) inp.addEventListener('input', () => { v.textContent = inp.value; });
    });

    // ── Scene ────────────────────────────────────────────
    const wrap = el('phantom-wrap');
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
    camera.position.set(0, 0, 5);

    // ── Bloom composer ───────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(512, 512), 0.6, 0.4, 0.5
    );
    composer.addPass(bloomPass);

    // ── Particle system ──────────────────────────────────
    const MAX_PARTICLES = 40000;

    // Shader for particles
    const particleVert = `
        uniform float uTime;
        uniform float uSize;
        uniform float uDepth;
        attribute float aAge;
        attribute float aLife;
        attribute float aSeed;
        attribute float aLayer;
        varying float vAlpha;
        varying float vLayer;

        void main() {
            vLayer = aLayer;
            float age = mod(aAge + uTime, aLife);
            float lifeRatio = age / aLife;

            // Fade in and out
            float fadeIn = smoothstep(0.0, 0.08, lifeRatio);
            float fadeOut = smoothstep(1.0, 0.85, lifeRatio);
            vAlpha = fadeIn * fadeOut;

            // Depth displacement
            float z = position.z + sin(uTime * 0.3 + aSeed * 6.28) * uDepth * 0.5;

            vec4 mvPos = modelViewMatrix * vec4(position.xy, z, 1.0);
            gl_Position = projectionMatrix * mvPos;
            gl_PointSize = uSize * (120.0 / -mvPos.z) * (0.3 + 0.7 * vAlpha);
        }
    `;
    const particleFrag = `
        uniform vec3 uColor;
        uniform float uBrightness;
        varying float vAlpha;
        varying float vLayer;

        void main() {
            float d = length(gl_PointCoord - 0.5) * 2.0;
            float glow = exp(-d * d * 5.0);
            float alpha = glow * vAlpha * uBrightness * 0.4;
            if (alpha < 0.005) discard;
            gl_FragColor = vec4(uColor * alpha * 0.8, alpha * 0.7);
        }
    `;

    const particleGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(MAX_PARTICLES * 3);
    const basePositions = new Float32Array(MAX_PARTICLES * 3);
    const ages = new Float32Array(MAX_PARTICLES);
    const lives = new Float32Array(MAX_PARTICLES);
    const seeds = new Float32Array(MAX_PARTICLES);
    const layers = new Float32Array(MAX_PARTICLES);

    // Initialize particles in a figure shape
    function initParticles() {
        for (let i = 0; i < MAX_PARTICLES; i++) {
            const seed = Math.random();
            seeds[i] = seed;
            ages[i] = Math.random() * 3;
            lives[i] = 1.5 + Math.random() * 2;
            layers[i] = Math.random();

            // Body silhouette via parametric distribution
            const ny = (Math.random() * 2 - 1); // -1 to 1
            const bodyWidth = figureProfile(ny);
            const nx = (Math.random() * 2 - 1) * bodyWidth;
            const nz = (Math.random() * 2 - 1) * 0.15;

            basePositions[i * 3] = nx;
            basePositions[i * 3 + 1] = ny;
            basePositions[i * 3 + 2] = nz;
            positions[i * 3] = nx;
            positions[i * 3 + 1] = ny;
            positions[i * 3 + 2] = nz;
        }
    }

    function figureProfile(ny) {
        // Human-like silhouette: narrow head, wider shoulders, tapered waist, flared base
        const y = ny * 0.5 + 0.5; // 0 = bottom, 1 = top
        const head = Math.exp(-Math.pow((y - 0.92) * 8, 2)) * 0.15;
        const neck = Math.exp(-Math.pow((y - 0.82) * 12, 2)) * 0.08;
        const shoulders = Math.exp(-Math.pow((y - 0.72) * 4, 2)) * 0.5;
        const torso = Math.exp(-Math.pow((y - 0.55) * 3, 2)) * 0.35;
        const hips = Math.exp(-Math.pow((y - 0.35) * 3.5, 2)) * 0.4;
        const legs = Math.exp(-Math.pow((y - 0.15) * 2.5, 2)) * 0.25;
        return Math.max(0.03, head + neck + shoulders + torso + hips + legs);
    }

    initParticles();

    particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeom.setAttribute('aAge', new THREE.BufferAttribute(ages, 1));
    particleGeom.setAttribute('aLife', new THREE.BufferAttribute(lives, 1));
    particleGeom.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
    particleGeom.setAttribute('aLayer', new THREE.BufferAttribute(layers, 1));

    const particleMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uSize: { value: 1.5 },
            uColor: { value: new THREE.Color(1, 1, 1) },
            uBrightness: { value: 0.4 },
            uDepth: { value: 0.4 },
        },
        vertexShader: particleVert,
        fragmentShader: particleFrag,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(particleGeom, particleMat);
    scene.add(particles);

    // ── Beam system ──────────────────────────────────────
    const beamGroup = new THREE.Group();
    scene.add(beamGroup);

    const beamMat = new THREE.ShaderMaterial({
        uniforms: {
            uColor: { value: new THREE.Color(1, 1, 1) },
            uAlpha: { value: 0.3 },
            uTime: { value: 0 },
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform vec3 uColor;
            uniform float uAlpha;
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                // Horizontal falloff (bright center, fading edges)
                float h = 1.0 - abs(vUv.x - 0.5) * 2.0;
                float glow = pow(h, 3.0);
                // Vertical gradient: bright middle, fadeout at edges
                float vFade = smoothstep(0.0, 0.15, vUv.y) * smoothstep(1.0, 0.85, vUv.y);
                // Flicker
                float flicker = 0.85 + 0.15 * sin(uTime * 4.0 + vUv.y * 20.0);
                float alpha = glow * vFade * uAlpha * flicker;
                gl_FragColor = vec4(uColor * alpha * 2.0, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
    });

    const MAX_BEAMS = 12;
    const beamMeshes = [];
    for (let i = 0; i < MAX_BEAMS; i++) {
        const geom = new THREE.PlaneGeometry(1, 8);
        const mat = beamMat.clone();
        const mesh = new THREE.Mesh(geom, mat);
        mesh.visible = false;
        beamGroup.add(mesh);
        beamMeshes.push(mesh);
    }

    // ── Scanline overlay (screen quad) ───────────────────
    const scanScene = new THREE.Scene();
    const scanCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const scanMat = new THREE.ShaderMaterial({
        uniforms: {
            uDensity: { value: 0.15 },
            uResolution: { value: new THREE.Vector2(512, 512) },
        },
        vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
        `,
        fragmentShader: `
            uniform float uDensity;
            uniform vec2 uResolution;
            varying vec2 vUv;
            void main() {
                float line = mod(gl_FragCoord.y, 3.0);
                float scan = step(line, 1.0) * uDensity * 0.3;
                gl_FragColor = vec4(0.0, 0.0, 0.0, scan);
            }
        `,
        transparent: true,
        depthWrite: false,
    });
    const scanQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), scanMat);
    scanScene.add(scanQuad);

    // ── Noise helpers ────────────────────────────────────
    function noise(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
    }
    function smoothNoise(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
        return (
            noise(ix, iy) * (1 - sx) * (1 - sy) +
            noise(ix + 1, iy) * sx * (1 - sy) +
            noise(ix, iy + 1) * (1 - sx) * sy +
            noise(ix + 1, iy + 1) * sx * sy
        );
    }
    function fbm(x, y) {
        return smoothNoise(x, y) * 0.5 + smoothNoise(x * 2, y * 2) * 0.25 + smoothNoise(x * 4, y * 4) * 0.125;
    }

    // ── Resize ───────────────────────────────────────────
    function resize() {
        const r = wrap.getBoundingClientRect();
        const w = r.width || 800, h = r.height || 600;
        renderer.setSize(w, h);
        composer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        scanMat.uniforms.uResolution.value.set(w, h);
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Animation ────────────────────────────────────────
    let t = 0;

    function animate() {
        requestAnimationFrame(animate);
        const dt = 1 / 60;
        t += dt;

        // Read params
        const pCount = Vi('p-count');
        const pWidth = V('p-width');
        const pHeight = V('p-height');
        const pStretch = V('p-stretch');
        const pMirror = V('p-mirror');
        const pSpeed = V('p-speed');
        const pRipple = V('p-ripple');
        const pDistort = V('p-distort');
        const pShimmer = V('p-shimmer');
        const pPulse = V('p-pulse');
        const pBeams = Vi('p-beams');
        const pBWidth = V('p-bwidth');
        const pBBright = V('p-bbright');
        const pBSpread = V('p-bspread');
        const pFracture = V('p-fracture');
        const pGlitch = V('p-glitch');
        const pVibrate = V('p-vibrate');
        const pScan = V('p-scan');
        const pBloom = V('p-bloom');
        const pBright = V('p-bright');
        const pTrail = V('p-trail');
        const pDepth = V('p-depth');
        const colorHex = el('p-color')?.value || '#ffffff';

        const color = new THREE.Color(colorHex);
        const activeCount = Math.floor(MAX_PARTICLES * (pCount / 100));
        const spd = pSpeed * 2;
        const pulse = 1 + pPulse * 0.3 * Math.sin(t * 1.8);

        // Update particle positions
        const pos = particleGeom.attributes.position.array;
        for (let i = 0; i < activeCount; i++) {
            const i3 = i * 3;
            const seed = seeds[i];
            const bx = basePositions[i3];
            const by = basePositions[i3 + 1];
            const bz = basePositions[i3 + 2];

            // Scale by figure params
            let x = bx * pWidth * 2.5 * pulse;
            let y = by * pHeight * 2 * (1 + pStretch * 0.8) * pulse;
            let z = bz * (1 + pDepth);

            // Ripple
            const ripplePhase = by * 10 + t * spd * 0.3 + seed * 6.28;
            x += Math.sin(ripplePhase) * pRipple * 0.15;
            y += Math.cos(ripplePhase * 0.7) * pRipple * 0.05;

            // Distortion (noise-based drift)
            const nv = fbm(seed * 5 + t * spd * 0.015, by * 3 + t * 0.01);
            x += (nv - 0.4) * pDistort * 0.6;
            y += smoothNoise(seed * 3 + t * 0.02, by + t * 0.01) * pDistort * 0.15;

            // Shimmer (high-freq position jitter)
            x += Math.sin(t * spd * 0.8 + seed * 100) * pShimmer * 0.02;
            y += Math.cos(t * spd * 0.6 + seed * 77) * pShimmer * 0.01;

            // Fracture: slice displacement
            if (pFracture > 0.01) {
                const fracCycle = Math.sin(t * 0.5) * 0.5 + 0.5;
                const sliceIdx = Math.floor((by + 1) * 8);
                const sliceOff = noise(sliceIdx, t * 0.03);
                x += (sliceOff - 0.5) * pFracture * 2.5 * fracCycle;
            }

            // Glitch: sudden horizontal jumps
            if (pGlitch > 0.01 && noise(i * 0.1, t * 0.4) > (1 - pGlitch * 0.25)) {
                x += (noise(i, t) - 0.5) * pGlitch * 3;
            }

            // Vibration
            if (pVibrate > 0.01) {
                x += (noise(seed + t * 3, i * 0.01) - 0.5) * pVibrate * 0.15;
                y += (noise(seed * 2 + t * 3, i * 0.02) - 0.5) * pVibrate * 0.08;
            }

            pos[i3] = x;
            pos[i3 + 1] = y;
            pos[i3 + 2] = z;
        }

        // Mirror: duplicate positions to the other side
        if (pMirror > 0.01) {
            // The mirroring is built into the shader via the base positions being sometimes negative X
            // We just keep the symmetry by ensuring base positions are symmetric
        }

        // Hide excess particles
        for (let i = activeCount; i < MAX_PARTICLES; i++) {
            const i3 = i * 3;
            pos[i3] = 0; pos[i3 + 1] = 100; pos[i3 + 2] = 0; // offscreen
        }

        particleGeom.attributes.position.needsUpdate = true;

        // Particle uniforms
        particleMat.uniforms.uTime.value = t;
        particleMat.uniforms.uColor.value.copy(color);
        particleMat.uniforms.uBrightness.value = pBright;
        particleMat.uniforms.uDepth.value = pDepth;
        particleMat.uniforms.uSize.value = 0.8 + pBright * 1.5;

        // Update beams
        for (let i = 0; i < MAX_BEAMS; i++) {
            const mesh = beamMeshes[i];
            if (i < pBeams) {
                mesh.visible = true;
                const spread = pBSpread * 4;
                const frac = pBeams <= 1 ? 0 : i / (pBeams - 1);
                const bx = (frac - 0.5) * spread;

                // Subtle sway
                const sway = Math.sin(t * 0.4 + i * 1.7) * 0.08;

                mesh.position.set(bx + sway, 0, -0.5);
                mesh.scale.set(pBWidth * 0.15 + 0.01, 1, 1);
                mesh.material.uniforms.uColor.value.copy(color);
                mesh.material.uniforms.uAlpha.value = pBBright * 0.6;
                mesh.material.uniforms.uTime.value = t + i * 2;
            } else {
                mesh.visible = false;
            }
        }

        // Camera subtle movement
        camera.position.x = Math.sin(t * 0.1) * 0.15;
        camera.position.y = Math.cos(t * 0.07) * 0.1;
        camera.lookAt(0, 0, 0);

        // Bloom
        bloomPass.strength = 0.15 + pBloom * 1.5;
        bloomPass.radius = 0.2 + pBloom * 0.4;
        bloomPass.threshold = 0.2 + (1 - pBloom) * 0.4;

        // Trail (background alpha via clearAlpha)
        const clearAlpha = 0.05 + (1 - pTrail) * 0.25;
        renderer.setClearColor(0x000000, 1);

        // Render
        composer.render();

        // Scanlines overlay
        if (pScan > 0.01) {
            scanMat.uniforms.uDensity.value = pScan;
            renderer.autoClear = false;
            renderer.render(scanScene, scanCamera);
            renderer.autoClear = true;
        }
    }

    animate();
    </script>
</body>
</html>
