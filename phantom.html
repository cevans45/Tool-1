<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .app[aria-label="Phantom"] { background: #000; }
        .app[aria-label="Phantom"] .control-panel {
            background: rgba(0,0,0,0.92);
            border-color: #222;
        }
        .app[aria-label="Phantom"] .panel-header { border-color: #333; }
        .app[aria-label="Phantom"] .panel-header h2 { color: #aaa; }
        
        /* White buttons / UI as requested */
        .app[aria-label="Phantom"] .control-window summary { color: #fff; }
        .app[aria-label="Phantom"] .control-window[open] summary { color: #fff; }
        .app[aria-label="Phantom"] .control-row label { color: #ddd; }
        .app[aria-label="Phantom"] .param-value { color: #ddd; }
        .app[aria-label="Phantom"] .control-window { border-color: #333; }
        
        .app[aria-label="Phantom"] .select-input {
            background: #111; color: #fff; border-color: #555;
        }
        .app[aria-label="Phantom"] .panel-button {
            background: transparent; color: #fff; border-color: #fff;
        }
        .app[aria-label="Phantom"] .panel-button:hover {
            background: #fff; color: #000;
        }
        .app[aria-label="Phantom"] .panel-button.is-active {
            background: #fff; color: #000;
        }
        .app[aria-label="Phantom"] .back-link { color: #aaa; }
        #phantom-wrap { flex:1; position:relative; overflow:hidden; }
        canvas { display:block; width:100%!important; height:100%!important; }
    </style>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header" style="background:#000;border-color:#222;">
            <a href="index.html" class="back-link" style="color:#aaa;">← Back to OVRT</a>
            <span class="tool-title" style="color:#fff;">Phantom</span>
        </header>
        <div class="app" aria-label="Phantom">
            <div id="phantom-wrap"></div>
            <aside class="control-panel">
                <header class="panel-header">
                    <h2 style="color:#fff;">Phantom</h2>
                </header>
                <div class="panel-body">
                    <details class="control-window" open>
                        <summary>Apparition + Beams</summary>
                        <section class="control-section">
                            <div class="control-row" style="padding-bottom:12px;">
                                <label>Mirror Mode</label>
                                <select id="p-mirror" class="select-input">
                                    <option value="0">Off</option>
                                    <option value="1">Left / Right</option>
                                    <option value="2">Up / Down</option>
                                    <option value="3">3-Way Radial</option>
                                    <option value="4">4-Way Radial</option>
                                    <option value="5">5-Way Radial</option>
                                </select>
                            </div>
                            <div class="control-row"><label>Count (x1000)</label><input type="range" id="p-count" min="10" max="100" value="50" step="1"><span class="param-value" id="vp-count">50</span></div>
                            <div class="control-row"><label>Speed</label><input type="range" id="p-speed" min="0" max="100" value="30" step="1"><span class="param-value" id="vp-speed">30</span></div>
                            <div class="control-row"><label>Field Noise</label><input type="range" id="p-noise" min="0" max="100" value="40" step="1"><span class="param-value" id="vp-noise">40</span></div>
                            <div class="control-row"><label>Beams Amount</label><input type="range" id="p-beams" min="0" max="100" value="30" step="1"><span class="param-value" id="vp-beams">30</span></div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Fracture & Glitch</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Fracture slices</label><input type="range" id="p-fracture" min="0" max="100" value="20" step="1"><span class="param-value" id="vp-fracture">20</span></div>
                            <div class="control-row"><label>Glitch Intensity</label><input type="range" id="p-glitch" min="0" max="100" value="0" step="1"><span class="param-value" id="vp-glitch">0</span></div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Style</summary>
                        <section class="control-section">
                            <div class="control-row"><label>Point Size</label><input type="range" id="p-size" min="1" max="50" value="10" step="1"><span class="param-value" id="vp-size">10</span></div>
                            <div class="control-row"><label>Trail Alpha</label><input type="range" id="p-trail" min="0" max="100" value="25" step="1"><span class="param-value" id="vp-trail">25</span></div>
                            <div class="control-row color-row"><label>Color</label><input type="color" id="p-color" value="#ffffff"></div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>

    <script type="module">
    import Olon, { Data } from "https://cdn.jsdelivr.net/npm/olon@0.0.0/src/Olon.js";

    const random = (min=0, max=1) => Math.random() * (max - min) + min;
    const floor = Math.floor;
    const min = Math.min;

    const el = id => document.getElementById(id);
    const val = id => parseFloat(el(id)?.value ?? 50);

    // Slider readouts
    document.querySelectorAll('.control-row input[type="range"]').forEach(inp => {
        const v = inp.parentElement.querySelector('.param-value');
        if (v) inp.addEventListener('input', () => { v.textContent = inp.value; });
    });

    const hexToRGB = (hex) => {
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        return [r, g, b];
    };

    // Shaders
    const UPDATE_VERT = `#version 300 es
    precision highp float;

    uniform float uTime;
    uniform float uTimeDelta;
    uniform vec2 uRandom;
    uniform vec2 uResolution;
    
    uniform float uSpeed;
    uniform float uNoiseStr;
    uniform float uBeams;

    in vec2 aPosition;
    in float aAge;
    in float aLife;
    in vec2 aVel;
    in float aSeed;

    out vec2 vPosition;
    out float vAge;
    out float vLife;
    out vec2 vVel;
    out float vSeed;

    // Simplex noise helper
    vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
    float snoise(vec2 v){
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy) );
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1; i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod(i, 289.0);
        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m ; m = m*m ;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
        vec3 g;
        g.x  = a0.x  * x0.x  + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
    }

    // Curl noise
    vec2 curlNoise(vec2 p) {
        float e = 0.01;
        float dx = snoise(p + vec2(e, 0.0)) - snoise(p - vec2(e, 0.0));
        float dy = snoise(p + vec2(0.0, e)) - snoise(p - vec2(0.0, e));
        return vec2(dy, -dx) / (2.0 * e);
    }

    void main() {
        vAge = aAge + uTimeDelta;
        vLife = aLife;
        vSeed = aSeed;
        
        // Body profile shape (normalized -1 to 1)
        float profile = pow(1.0 - abs(aSeed * 2.0 - 1.0), 0.5); 

        if (vAge >= aLife) {
            // Respawn
            vAge = 0.0;
            vLife = aLife; // keep same life length or could randomize

            // Randomizer for respawn
            float rnd1 = fract(sin(dot(vec2(vSeed, uTime), vec2(12.9898, 78.233))) * 43758.5453);
            float rnd2 = fract(sin(dot(vec2(uTime, vSeed), vec2(39.346, 11.135))) * 43758.5453);

            // Is this a beam particle or a body particle?
            if (rnd1 < uBeams * 0.01) {
                // Beam particle - snap to specific vertical columns
                float beamIdx = floor(rnd2 * 5.0) - 2.0; // 5 beams: -2, -1, 0, 1, 2
                float bx = beamIdx * 0.2 * uResolution.x;
                float by = (rnd1 - 0.5) * uResolution.y * 1.5;
                vPosition = vec2(bx, by);
                vVel = vec2(0.0, uSpeed * 100.0);
            } else {
                // Body particle
                float ny = rnd1 * 2.0 - 1.0; 
                float w = 0.4 * pow(1.0 - abs(ny), 0.6) + 0.1; // figure silhouette width
                float nx = (rnd2 * 2.0 - 1.0) * w * uResolution.x * 0.5;
                
                vPosition = vec2(nx, ny * uResolution.y * 0.4);
                vVel = vec2(0.0);
            }
        } else {
            // Update
             vec2 vel = aVel;
             
             // Base noise movement
             vec2 flow = curlNoise(aPosition * 0.002 + vec2(0.0, -uTime * 0.5));
             vel += flow * uNoiseStr * 15.0;

             // Attraction to origin or symmetry
             vel.x -= aPosition.x * 0.5 * uNoiseStr; 

             // Apply speed modifier
             vPosition = aPosition + vel * uTimeDelta * (uSpeed * 0.05);
             vVel = vel * 0.95; // dampening
        }
    }
    `;

    const UPDATE_FRAG = `#version 300 es
    precision mediump float;
    void main() { discard; }
    `;

    const RENDER_VERT = `#version 300 es
    precision highp float;

    uniform vec2 uResolution;
    uniform float uTime;
    
    // uniforms for distortion
    uniform float uFracture;
    uniform float uGlitch;
    uniform float uPointSize;
    uniform int uMirror;

    in vec2 aPosition;
    in float aAge;
    in float aLife;
    in vec2 aVel;
    in float aSeed;

    out float vAlpha;

    // Simplex noise
    vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
    float snoise(vec2 v){
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy) );
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1; i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod(i, 289.0);
        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m ; m = m*m ;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
        vec3 g;
        g.x  = a0.x  * x0.x  + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
    }

    void main() {
        vec2 pos = aPosition;

        // Fracture displacement (horizontal tearing)
        if (uFracture > 0.0) {
            float slice = floor((pos.y / uResolution.y) * 10.0 + uTime * 2.0);
            float offset = snoise(vec2(slice, uTime * 0.5)) * uResolution.x * 0.1 * (uFracture * 0.01);
            pos.x += offset;
        }

        // Glitch (random frame-based jumps)
        if (uGlitch > 0.0) {
            float g = fract(sin(dot(vec2(uTime, aSeed), vec2(12.9898,78.233))) * 43758.5453);
            if (g > (1.0 - uGlitch * 0.01)) {
                pos.x += (snoise(vec2(aSeed, uTime)) * 200.0);
            }
        }

        // Mirror symmetry using gl_VertexID
        if (uMirror == 1) { // Left/Right
            if (gl_VertexID % 2 == 1) pos.x = -pos.x;
        } else if (uMirror == 2) { // Up/Down
            if (gl_VertexID % 2 == 1) pos.y = -pos.y;
        } else if (uMirror >= 3) { // Radial (3, 4, 5-way)
            int copies = uMirror;
            int copyIdx = gl_VertexID % copies;
            if (copyIdx > 0) {
                float angle = float(copyIdx) * 6.2831853 / float(copies);
                float c = cos(angle);
                float s = sin(angle);
                pos = vec2(pos.x * c - pos.y * s, pos.x * s + pos.y * c);
            }
        }

        // Clip space assumes position is centered at (0,0) and resolution is width/height
        vec2 clipPos = (pos / (uResolution * 0.5));
        
        // Reverse Y so it's not upside down
        clipPos.y *= -1.0;

        gl_Position = vec4(clipPos, 0.0, 1.0);
        
        // Size
        gl_PointSize = uPointSize * (aLife - aAge) / aLife;

        // Fade out based on age
        float ageRatio = aAge / aLife;
        vAlpha = smoothstep(0.0, 0.1, ageRatio) * smoothstep(1.0, 0.8, ageRatio);
    }
    `;

    const RENDER_FRAG = `#version 300 es
    precision highp float;

    uniform vec3 uColor;
    in float vAlpha;
    out vec4 fragColor;

    void main() {
        // Soft circle
        vec2 uv = gl_PointCoord.xy - 0.5;
        float d = length(uv);
        float circle = smoothstep(0.5, 0.2, d);
        if (circle < 0.01) discard;

        fragColor = vec4(uColor, vAlpha * circle);
    }
    `;

    // ── Olon Setup ──
    const wrap = el('phantom-wrap');
    let width = wrap.clientWidth || 800;
    let height = wrap.clientHeight || 800;

    const ol = Olon(width, height);
    wrap.appendChild(ol.canvas);
    ol.canvas.style.display = 'block';

    // Additive blending for particles
    ol.blend({
        sfactor: ol.SRC_ALPHA,
        dfactor: ol.ONE, // Additive blending for light effects
    });
    ol.enableBlend();

    const TFV = ["vPosition", "vAge", "vLife", "vVel", "vSeed"];
    const updateProgram = ol.createProgram(UPDATE_VERT, UPDATE_FRAG, TFV);
    const renderProgram = ol.createProgram(RENDER_VERT, RENDER_FRAG);

    const attributes = [
        { name: "aPosition", unit: "f32", size: 2 },
        { name: "aAge", unit: "f32", size: 1 },
        { name: "aLife", unit: "f32", size: 1 },
        { name: "aVel", unit: "f32", size: 2 },
        { name: "aSeed", unit: "f32", size: 1 }
    ];

    const MAX_AMOUNT = 100000;
    const MIN_AGE = 1.0;
    const MAX_AGE = 3.0;
    
    const particleData = [];
    for (let i = 0; i < MAX_AMOUNT; i++) {
        const life = random(MIN_AGE, MAX_AGE);
        // initial state doesn't matter much, they'll respawn
        particleData.push(0, 0); // aPosition
        particleData.push(life + 1); // aAge (starts dead to force respawn)
        particleData.push(life); // aLife
        particleData.push(0, 0); // aVel
        particleData.push(random()); // aSeed
    }
    const initData = Data(particleData);

    // Two buffers for Transform Feedback ping-pong
    const buffer0 = ol.createBuffer(initData, ol.STREAM_DRAW);
    const buffer1 = ol.createBuffer(initData, ol.STREAM_DRAW);

    const vao0 = ol.createVAO(updateProgram, { buffer: buffer0, stride: 4 * 7, attributes });
    const vao1 = ol.createVAO(updateProgram, { buffer: buffer1, stride: 4 * 7, attributes });
    
    const renderVao0 = ol.createVAO(renderProgram, { buffer: buffer0, stride: 4 * 7, attributes });
    const renderVao1 = ol.createVAO(renderProgram, { buffer: buffer1, stride: 4 * 7, attributes });

    const buffers = [buffer0, buffer1];
    const updateVaos = [vao0, vao1];
    const renderVaos = [renderVao0, renderVao1];
    
    let [read, write] = [0, 1];
    let lastTime = 0;

    window.addEventListener('resize', () => {
        width = wrap.clientWidth;
        height = wrap.clientHeight;
        ol.resize(width, height);
    });

    // Main render loop
    ol.render(() => {
        const time = ol.frame / 60;
        const timeDelta = time - lastTime;
        lastTime = time;

        const countParam = val('p-count') * 1000; 
        const renderAmount = min(MAX_AMOUNT, countParam);

        // Frame clear
        ol.clearColor(0, 0, 0, 1);
        ol.clearDepth();
        ol.clear();

        // Update pass
        ol.use({ program: updateProgram }).run(() => {
            ol.transformFeedback(updateVaos[read], buffers[write], ol.POINTS, () => {
                ol.uniform("uTimeDelta", timeDelta);
                ol.uniform("uTime", time);
                ol.uniform("uResolution", [width, height]);
                
                // Params
                ol.uniform("uSpeed", val('p-speed'));
                ol.uniform("uNoiseStr", val('p-noise'));
                ol.uniform("uBeams", val('p-beams'));

                ol.points(0, renderAmount);
            });
        });

        // Render pass
        ol.use({
            program: renderProgram,
            VAO: renderVaos[write],
        }).run(() => {
            ol.uniform("uResolution", [width, height]);
            ol.uniform("uTime", time);
            
            // Render params
            ol.uniform("uFracture", val('p-fracture'));
            ol.uniform("uGlitch", val('p-glitch'));
            ol.uniform("uPointSize", val('p-size') * (window.devicePixelRatio || 1) * 0.2); // scale down slider max 50
            ol.uniform("uMirror", parseInt(el('p-mirror').value, 10));
            
            const colorRGB = hexToRGB(el('p-color').value);
            ol.uniform("uColor", colorRGB);

            ol.points(0, renderAmount);
        });

        // Swap buffers
        let temp = read;
        read = write;
        write = temp;
    });
    </script>
</body>
</html>
