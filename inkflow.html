<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkflow — OVRT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Inkflow</span>
        </header>

        <div class="app" aria-label="Inkflow">
            <div id="inkflow-canvas-wrap">
                <canvas id="inkflow-canvas"></canvas>
            </div>

            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Controls</h2>
                </header>

                <div class="panel-body">
                    <details class="control-window" open>
                        <summary>Inkflow</summary>
                        <section class="control-section">
                            <div class="control-row" style="margin-bottom:12px;">
                                <div class="mode-switch" style="width:100%; margin:0;">
                                    <button id="if-tab-sketch" class="panel-button is-active" type="button">Sketch</button>
                                    <button id="if-tab-generate" class="panel-button" type="button">Generate</button>
                                </div>
                            </div>

                            <div class="control-row" id="if-generate-row" style="display:none;">
                                <button id="if-generate" class="panel-button" type="button" style="width:100%;">Generate</button>
                            </div>

                            <div class="control-row">
                                <label for="if-size">Size</label>
                                <input id="if-size" type="range" min="0.2" max="22" step="0.1" value="4.5">
                                <span id="if-size-val" class="param-value">4.5</span>
                            </div>

                            <div class="control-row">
                                <label for="if-marker">Marker</label>
                                <select id="if-marker" class="select-input">
                                    <option value="line" selected>Line</option>
                                    <option value="sprinkle">Sprinkle</option>
                                    <option value="inkblot">Inkblot</option>
                                </select>
                            </div>

                            <label class="checkbox-label">
                                <input id="if-mirror-x" type="checkbox" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror left-right</span>
                            </label>

                            <label class="checkbox-label">
                                <input id="if-mirror-y" type="checkbox">
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror top-bottom</span>
                            </label>

                            <div class="control-row color-row">
                                <label for="if-ink">Ink</label>
                                <input id="if-ink" type="color" value="#000000">
                            </div>

                            <div class="control-row color-row">
                                <label for="if-bg">Background</label>
                                <input id="if-bg" type="color" value="#ffffff">
                            </div>

                            <div class="control-row" style="gap:6px;">
                                <button id="if-clear" class="panel-button" type="button">Clear</button>
                                <button id="if-export" class="panel-button" type="button">Export PNG</button>
                            </div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>

    <style>
        #inkflow-canvas-wrap { flex: 1; min-width: 0; height: 100%; }
        #inkflow-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    </style>

    <script src="page-transition.js"></script>
    <script>
        const canvas = document.getElementById('inkflow-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const $ = (id) => document.getElementById(id);
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        const state = {
            tab: 'sketch',
            size: 4.5,
            marker: 'line',
            mirrorX: true,
            mirrorY: false,
            ink: '#000000',
            bg: '#ffffff',
            isDrawing: false,
            points: [],
            undo: []
        };

        let cssW = 1, cssH = 1, dpr = 1;

        function resize() {
            const r = canvas.parentElement.getBoundingClientRect();
            cssW = Math.max(1, r.width || window.innerWidth);
            cssH = Math.max(1, r.height || window.innerHeight);
            dpr = Math.max(1, window.devicePixelRatio || 1);
            canvas.width = Math.floor(cssW * dpr);
            canvas.height = Math.floor(cssH * dpr);
            canvas.style.width = `${cssW}px`;
            canvas.style.height = `${cssH}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            repaintBackground();
        }

        function repaintBackground() {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
            ctx.fillStyle = state.bg;
            ctx.fillRect(0, 0, cssW, cssH);
        }

        function mirroredPoints(x, y) {
            const pts = [{ x, y }];
            if (state.mirrorX) pts.push({ x: cssW - x, y });
            if (state.mirrorY) pts.push({ x, y: cssH - y });
            if (state.mirrorX && state.mirrorY) pts.push({ x: cssW - x, y: cssH - y });
            return pts;
        }

        function drawSegment(x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy) || 1;
            const distFactor = Math.max(0.2, (72 - len) / 10);
            const w = state.size * distFactor;
            const jitter = 3.5 + w * 0.75;
            const dir = Math.atan2(dy, dx);
            const passes = Math.max(3, Math.round(5 + Math.abs(Math.sin(dir * 1.7)) * 3));

            ctx.fillStyle = state.ink;
            ctx.strokeStyle = state.ink;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (state.marker === 'sprinkle') {
                const dots = Math.max(3, Math.floor(len / 10));
                for (let p = 0; p < passes; p++) {
                    for (let i = 0; i < dots; i++) {
                        const t = Math.random();
                        const px = x1 + dx * t + (Math.random() - 0.5) * jitter;
                        const py = y1 + dy * t + (Math.random() - 0.5) * jitter;
                        const r = Math.max(0.35, w * (0.1 + Math.random() * 0.25));
                        const m = mirroredPoints(px, py);
                        for (let k = 0; k < m.length; k++) {
                            ctx.beginPath();
                            ctx.arc(m[k].x, m[k].y, r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                return;
            }

            if (state.marker === 'inkblot') {
                const samples = Math.max(6, Math.floor(len / 5));
                for (let p = 0; p < passes; p++) {
                    for (let i = 0; i < samples; i++) {
                        const t = samples <= 1 ? 0.5 : i / (samples - 1);
                        const px = x1 + dx * t + (Math.random() - 0.5) * jitter * 0.6;
                        const py = y1 + dy * t + (Math.random() - 0.5) * jitter * 0.6;
                        const r = Math.max(0.45, w * (0.28 + Math.random() * 0.7));
                        const m = mirroredPoints(px, py);
                        for (let k = 0; k < m.length; k++) {
                            ctx.beginPath();
                            ctx.arc(m[k].x, m[k].y, r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                return;
            }

            for (let p = 0; p < passes; p++) {
                const ax = x1 + (Math.random() - 0.5) * jitter;
                const ay = y1 + (Math.random() - 0.5) * jitter;
                const bx = x2 + (Math.random() - 0.5) * jitter;
                const by = y2 + (Math.random() - 0.5) * jitter;
                ctx.lineWidth = w;
                const lines = [
                    { x1: ax, y1: ay, x2: bx, y2: by }
                ];
                if (state.mirrorX) lines.push({ x1: cssW - ax, y1: ay, x2: cssW - bx, y2: by });
                if (state.mirrorY) lines.push({ x1: ax, y1: cssH - ay, x2: bx, y2: cssH - by });
                if (state.mirrorX && state.mirrorY) lines.push({ x1: cssW - ax, y1: cssH - ay, x2: cssW - bx, y2: cssH - by });
                ctx.beginPath();
                for (let i = 0; i < lines.length; i++) {
                    ctx.moveTo(lines[i].x1, lines[i].y1);
                    ctx.lineTo(lines[i].x2, lines[i].y2);
                }
                ctx.stroke();
            }
        }

        function pushUndo() {
            const snap = document.createElement('canvas');
            snap.width = canvas.width;
            snap.height = canvas.height;
            snap.getContext('2d').drawImage(canvas, 0, 0);
            state.undo.push(snap);
            if (state.undo.length > 30) state.undo.shift();
        }

        function doUndo() {
            const snap = state.undo.pop();
            if (!snap) return;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(snap, 0, 0);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function pointFromEvt(e) {
            const r = canvas.getBoundingClientRect();
            const t = e.touches && e.touches[0];
            const cx = t ? t.clientX : e.clientX;
            const cy = t ? t.clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        }

        function onDown(e) {
            if (state.tab !== 'sketch') return;
            state.isDrawing = true;
            pushUndo();
            const p = pointFromEvt(e);
            state.points.push(p);
        }

        function onMove(e) {
            if (state.tab !== 'sketch' || !state.isDrawing) return;
            const p = pointFromEvt(e);
            const prev = state.points[state.points.length - 1];
            if (prev) drawSegment(prev.x, prev.y, p.x, p.y);
            state.points.push(p);
        }

        function onUp() {
            if (!state.isDrawing) return;
            state.isDrawing = false;
            state.points.push(null);
        }

        function generate() {
            pushUndo();
            repaintBackground();
            state.points = [];
            const n = Math.max(200, Math.floor((cssW * cssH) / 9000));
            let x = 20 + Math.random() * (cssW - 40);
            let y = 20 + Math.random() * (cssH - 40);
            let a = Math.random() * Math.PI * 2;
            state.points.push({ x, y });
            for (let i = 0; i < n; i++) {
                if (Math.random() < 0.05) {
                    x = 20 + Math.random() * (cssW - 40);
                    y = 20 + Math.random() * (cssH - 40);
                    a = Math.random() * Math.PI * 2;
                    state.points.push(null, { x, y });
                    continue;
                }
                a += (Math.random() - 0.5) * 1.0;
                const step = 6 + Math.random() * 20;
                const nx = clamp(x + Math.cos(a) * step, 12, cssW - 12);
                const ny = clamp(y + Math.sin(a) * step, 12, cssH - 12);
                drawSegment(x, y, nx, ny);
                x = nx; y = ny;
                state.points.push({ x, y });
            }
        }

        // UI
        $('if-tab-sketch').addEventListener('click', () => {
            state.tab = 'sketch';
            $('if-tab-sketch').classList.add('is-active');
            $('if-tab-generate').classList.remove('is-active');
            $('if-generate-row').style.display = 'none';
        });
        $('if-tab-generate').addEventListener('click', () => {
            state.tab = 'generate';
            $('if-tab-generate').classList.add('is-active');
            $('if-tab-sketch').classList.remove('is-active');
            $('if-generate-row').style.display = 'flex';
        });

        $('if-generate').addEventListener('click', generate);

        $('if-size').addEventListener('input', (e) => {
            state.size = parseFloat(e.target.value);
            $('if-size-val').textContent = state.size < 1 ? state.size.toFixed(1) : String(Math.round(state.size * 10) / 10);
        });
        $('if-marker').addEventListener('change', (e) => state.marker = e.target.value);
        $('if-mirror-x').addEventListener('change', (e) => state.mirrorX = e.target.checked);
        $('if-mirror-y').addEventListener('change', (e) => state.mirrorY = e.target.checked);
        $('if-ink').addEventListener('input', (e) => state.ink = e.target.value);
        $('if-bg').addEventListener('input', (e) => { state.bg = e.target.value; repaintBackground(); });
        $('if-clear').addEventListener('click', () => { pushUndo(); repaintBackground(); state.points = []; });
        $('if-export').addEventListener('click', () => {
            const out = document.createElement('canvas');
            out.width = canvas.width; out.height = canvas.height;
            const octx = out.getContext('2d');
            octx.fillStyle = state.bg;
            octx.fillRect(0, 0, out.width, out.height);
            octx.drawImage(canvas, 0, 0);
            const a = document.createElement('a');
            a.download = 'inkflow.png';
            a.href = out.toDataURL('image/png');
            a.click();
        });

        window.addEventListener('keydown', (e) => {
            const key = (e.key || '').toLowerCase();
            if ((e.metaKey || e.ctrlKey) && key === 'z') {
                e.preventDefault();
                doUndo();
            } else if (e.code === 'Space') {
                e.preventDefault();
                pushUndo();
                repaintBackground();
                state.points = [];
            }
        });

        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('blur', onUp);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
        canvas.addEventListener('touchend', onUp);
        canvas.addEventListener('touchcancel', onUp);

        const infoBtn = document.getElementById('infoBtn');
        const infoClose = document.getElementById('infoClose');
        const infoOverlay = document.getElementById('infoOverlay');

        infoBtn?.addEventListener('click', () => infoOverlay.hidden = false);
        infoClose?.addEventListener('click', () => infoOverlay.hidden = true);
        infoOverlay?.addEventListener('click', (e) => { if (e.target === infoOverlay) infoOverlay.hidden = true; });

        window.addEventListener('resize', () => requestAnimationFrame(resize));
        resize();
    </script>
</body>
</html>
