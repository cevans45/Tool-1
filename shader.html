<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism weave — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Prism weave</span>
        </header>
        <div class="app" aria-label="Prism weave">
            <div id="shader-canvas"></div>
            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Controls</h2>
                </header>
                <div class="panel-body">
                    <div class="control-row" style="margin-bottom:8px;">
                        <label for="sh-preset">Preset</label>
                        <select id="sh-preset" class="select-input">
                            <option value="prism" selected>Prism Weave</option>
                            <option value="cubes">Nested Cubes</option>
                            <option value="organic">Liquid Globe</option>
                            <option value="bands">Noise Bands</option>
                            <option value="spiral">Spiral Field</option>
                            <option value="tunnel">Warp Tunnel</option>
                            <option value="moire">Moire Waves</option>
                        </select>
                    </div>

                    <details class="control-window">
                        <summary>Cycle</summary>
                        <section class="control-section">
                        <div class="control-row">
                            <label for="sh-cycle">Duration</label>
                            <input type="range" id="sh-cycle" min="20" max="180" value="79" step="1">
                            <span class="param-value" id="val-sh-cycle">79s</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-black">Black hold</label>
                            <input type="range" id="sh-black" min="0" max="10" value="0" step="1">
                            <span class="param-value" id="val-sh-black">0s</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-fade-in">Fade in</label>
                            <input type="range" id="sh-fade-in" min="1" max="30" value="2" step="1">
                            <span class="param-value" id="val-sh-fade-in">2s</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-fade-out">Fade out</label>
                            <input type="range" id="sh-fade-out" min="1" max="20" value="5" step="1">
                            <span class="param-value" id="val-sh-fade-out">5s</span>
                        </div>
                        </section>
                    </details>

                    <details class="control-window">
                        <summary>Zoom & mirrors</summary>
                        <section class="control-section">
                        <div class="control-row">
                            <label for="sh-zoom-min">Zoom min</label>
                            <input type="range" id="sh-zoom-min" min="5" max="150" value="10" step="1">
                            <span class="param-value" id="val-sh-zoom-min">0.10</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-zoom-max">Zoom max</label>
                            <input type="range" id="sh-zoom-max" min="20" max="600" value="300" step="5">
                            <span class="param-value" id="val-sh-zoom-max">3.00</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-zoom-speed">Zoom speed</label>
                            <input type="range" id="sh-zoom-speed" min="2" max="80" value="10" step="1">
                            <span class="param-value" id="val-sh-zoom-speed">0.10</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-mirror-min">Mirror min</label>
                            <input type="range" id="sh-mirror-min" min="2" max="10" value="3" step="1">
                            <span class="param-value" id="val-sh-mirror-min">3</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-mirror-span">Mirror span</label>
                            <input type="range" id="sh-mirror-span" min="1" max="10" value="6" step="1">
                            <span class="param-value" id="val-sh-mirror-span">6</span>
                        </div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Rotation & look</summary>
                        <section class="control-section">
                        <div class="control-row">
                            <label for="sh-rot-start">Rot start %</label>
                            <input type="range" id="sh-rot-start" min="0" max="95" value="60" step="1">
                            <span class="param-value" id="val-sh-rot-start">60%</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-rot-max">Rot max</label>
                            <input type="range" id="sh-rot-max" min="0" max="180" value="90" step="1">
                            <span class="param-value" id="val-sh-rot-max">90°</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-bright">Brightness</label>
                            <input type="range" id="sh-bright" min="20" max="200" value="80" step="1">
                            <span class="param-value" id="val-sh-bright">0.80</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-warp">Warp</label>
                            <input type="range" id="sh-warp" min="0" max="300" value="120" step="1">
                            <span class="param-value" id="val-sh-warp">1.20</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-stripes">Stripes</label>
                            <input type="range" id="sh-stripes" min="1" max="24" value="5" step="1">
                            <span class="param-value" id="val-sh-stripes">5</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-pulse">Pulse</label>
                            <input type="range" id="sh-pulse" min="0" max="300" value="90" step="1">
                            <span class="param-value" id="val-sh-pulse">0.90</span>
                        </div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Texture & detail</summary>
                        <section class="control-section">
                        <div class="control-row">
                            <label for="sh-texture-mode">Texture mode</label>
                            <select id="sh-texture-mode" class="select-input">
                                <option value="none">None</option>
                                <option value="grain" selected>Grain</option>
                                <option value="dots">Dots</option>
                                <option value="both">Both</option>
                            </select>
                        </div>
                        <div class="control-row" id="row-sh-grain">
                            <label for="sh-grain">Grain</label>
                            <input type="range" id="sh-grain" min="0" max="100" value="6" step="1">
                            <span class="param-value" id="val-sh-grain">0.06</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-weave">Weave</label>
                            <input type="range" id="sh-weave" min="0" max="200" value="40" step="1">
                            <span class="param-value" id="val-sh-weave">0.40</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-star">Star</label>
                            <input type="range" id="sh-star" min="0" max="200" value="45" step="1">
                            <span class="param-value" id="val-sh-star">0.45</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-ring">Ring</label>
                            <input type="range" id="sh-ring" min="0" max="200" value="55" step="1">
                            <span class="param-value" id="val-sh-ring">0.55</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-contrast">Contrast</label>
                            <input type="range" id="sh-contrast" min="20" max="300" value="120" step="1">
                            <span class="param-value" id="val-sh-contrast">1.20</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-vignette">Vignette</label>
                            <input type="range" id="sh-vignette" min="20" max="400" value="260" step="1">
                            <span class="param-value" id="val-sh-vignette">2.60</span>
                        </div>
                        <div class="control-row dots-row" id="row-sh-cellularity">
                            <label for="sh-cellularity">Cell dots</label>
                            <input type="range" id="sh-cellularity" min="0" max="200" value="80" step="1">
                            <span class="param-value" id="val-sh-cellularity">0.80</span>
                        </div>
                        <div class="control-row dots-row" id="row-sh-cell-density">
                            <label for="sh-cell-density">Cell density</label>
                            <input type="range" id="sh-cell-density" min="10" max="260" value="120" step="1">
                            <span class="param-value" id="val-sh-cell-density">120</span>
                        </div>
                        <div class="control-row dots-row" id="row-sh-cell-softness">
                            <label for="sh-cell-softness">Cell softness</label>
                            <input type="range" id="sh-cell-softness" min="1" max="80" value="14" step="1">
                            <span class="param-value" id="val-sh-cell-softness">0.14</span>
                        </div>
                        <div class="control-row dots-row" id="row-sh-cell-shift">
                            <label for="sh-cell-shift">Cell shift</label>
                            <input type="range" id="sh-cell-shift" min="0" max="100" value="30" step="1">
                            <span class="param-value" id="val-sh-cell-shift">0.30</span>
                        </div>
                        </section>
                    </details>

                    <details class="control-window">
                        <summary>Color tuning</summary>
                        <section class="control-section">
                        <div class="control-row">
                            <label for="sh-hue">Hue shift</label>
                            <input type="range" id="sh-hue" min="0" max="360" value="0" step="1">
                            <span class="param-value" id="val-sh-hue">0°</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-spread">Palette spread</label>
                            <input type="range" id="sh-spread" min="20" max="200" value="100" step="1">
                            <span class="param-value" id="val-sh-spread">1.00</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-sat">Saturation</label>
                            <input type="range" id="sh-sat" min="0" max="200" value="100" step="1">
                            <span class="param-value" id="val-sh-sat">1.00</span>
                        </div>
                        <div class="control-row color-row">
                            <label for="sh-tint-color">Tint color</label>
                            <input type="color" id="sh-tint-color" value="#ff2aa1">
                        </div>
                        <div class="control-row">
                            <label for="sh-tint">Tint amount</label>
                            <input type="range" id="sh-tint" min="0" max="100" value="0" step="1">
                            <span class="param-value" id="val-sh-tint">0.00</span>
                        </div>
                        <div class="control-row">
                            <label for="sh-lock-seed">Lock seed</label>
                            <input type="checkbox" id="sh-lock-seed">
                        </div>
                        <div class="control-row">
                            <label for="sh-seed">Fixed seed</label>
                            <input type="number" id="sh-seed" min="0" max="999999999" value="0" step="1">
                        </div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>
    <script src="shader.js"></script>
</body>
</html>
