<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber sigilism — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Cyber sigilism generator</span>
        </header>
        <div class="app" aria-label="Cyber sigilism generator">
            <div id="sigil-canvas"></div>
            <aside class="control-panel">
                <div class="mode-switch" id="cs-main-mode" style="margin:0;">
                    <button type="button" id="cs-mode-sketch" class="panel-button is-active">Sketch</button>
                    <button type="button" id="cs-mode-generate" class="panel-button">Generate</button>
                </div>
                <div class="panel-body">
                    <details class="control-window" id="section-sketch-core" open>
                        <summary>Draw</summary>
                        <section class="control-section">
                            <span class="control-row" style="margin-bottom:6px;">
                                <label>Brush</label>
                            </span>
                            <div class="mode-switch" style="margin-bottom:14px;">
                                <button type="button" id="cs-mode-ink" class="panel-button is-active">ADD +</button>
                                <button type="button" id="cs-mode-cut" class="panel-button">ERASE −</button>
                            </div>

                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-mirror-x" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror</span>
                            </label>

                            <div class="control-row">
                                <label for="cs-stroke">Size</label>
                                <input type="range" id="cs-stroke" min="1" max="12" value="2" step="1">
                                <span class="param-value" id="val-cs-stroke">2</span>
                            </div>

                            <div class="control-row" id="row-cs-sketch-reach">
                                <label for="cs-sketch-reach">Reach</label>
                                <input type="range" id="cs-sketch-reach" min="10" max="200" value="70" step="5">
                                <span class="param-value" id="val-cs-sketch-reach">70</span>
                            </div>

                            <div class="control-row" style="gap:6px;">
                                <button type="button" id="cs-clear" class="panel-button">Clear</button>
                                <button type="button" id="cs-export" class="panel-button">Export PNG</button>
                            </div>

                            <div class="shortcuts-block">
                                <span>[1]</span> ADD &nbsp; <span>[2]</span> ERASE &nbsp; <span>[⌘Z]</span> UNDO<br>
                                <span>[M]</span> MIRROR &nbsp; <span>[SPACE]</span> CLEAR &nbsp; <span>[S]</span> EXPORT
                            </div>
                        </section>
                    </details>

                    <details class="control-window" id="section-sketch-style" open>
                        <summary>Style</summary>
                        <section class="control-section">
                            <div class="control-row">
                                <label for="cs-sketch-roughness">Roughness</label>
                                <input type="range" id="cs-sketch-roughness" min="0" max="20" value="4" step="1">
                                <span class="param-value" id="val-cs-sketch-roughness">4</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-sketch-density">Density</label>
                                <input type="range" id="cs-sketch-density" min="1" max="16" value="6" step="1">
                                <span class="param-value" id="val-cs-sketch-density">6</span>
                            </div>
                            <div class="control-row color-row">
                                <label for="cs-bg-sketch">Background</label>
                                <input type="color" id="cs-bg-sketch" value="#ffffff">
                            </div>
                            <div class="control-row color-row">
                                <label for="cs-ink-sketch">Ink</label>
                                <input type="color" id="cs-ink-sketch" value="#000000">
                            </div>
                        </section>
                    </details>

                    <details class="control-window" id="section-structure" open>
                        <summary>Structure</summary>
                        <section class="control-section">
                            <div class="control-row" style="gap:6px; margin-bottom:12px;">
                                <button type="button" id="cs-regenerate" class="panel-button" style="flex:1;">Regenerate</button>
                                <button type="button" id="cs-random-seed" class="panel-button" style="flex:1;">Random</button>
                                <button type="button" id="cs-export-gen" class="panel-button">Export</button>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-mirror-x-gen" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror X</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-mirror-y">
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror Y</span>
                            </label>
                            <div class="control-row">
                                <label for="cs-seed">Seed</label>
                                <input type="number" id="cs-seed" min="0" max="999999999" value="0" step="1">
                            </div>
                            <div class="control-row">
                                <label for="cs-curves">Curves</label>
                                <input type="range" id="cs-curves" min="2" max="16" value="7" step="1">
                                <span class="param-value" id="val-cs-curves">7</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-samples">Samples</label>
                                <input type="range" id="cs-samples" min="30" max="220" value="110" step="5">
                                <span class="param-value" id="val-cs-samples">110</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-influence">Influence</label>
                                <input type="range" id="cs-influence" min="4" max="48" value="20" step="1">
                                <span class="param-value" id="val-cs-influence">20</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-threshold">Threshold</label>
                                <input type="range" id="cs-threshold" min="10" max="90" value="44" step="1">
                                <span class="param-value" id="val-cs-threshold">0.44</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-prune">Prune passes</label>
                                <input type="range" id="cs-prune" min="0" max="24" value="7" step="1">
                                <span class="param-value" id="val-cs-prune">7</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-branch">Branch chance</label>
                                <input type="range" id="cs-branch" min="0" max="100" value="35" step="1">
                                <span class="param-value" id="val-cs-branch">35%</span>
                            </div>
                        </section>
                    </details>

                    <details class="control-window" id="section-smoothing">
                        <summary>Smoothing</summary>
                        <section class="control-section">
                            <div class="control-row">
                                <label for="cs-blurs">Blur passes</label>
                                <input type="range" id="cs-blurs" min="0" max="200" value="62" step="1">
                                <span class="param-value" id="val-cs-blurs">62</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-blur-strength">Blur strength</label>
                                <input type="range" id="cs-blur-strength" min="0" max="100" value="18" step="1">
                                <span class="param-value" id="val-cs-blur-strength">0.18</span>
                            </div>
                        </section>
                    </details>

                    <details class="control-window" id="section-style">
                        <summary>Style</summary>
                        <section class="control-section">
                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-stroke-enabled" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Stroke on</span>
                            </label>
                            <div class="control-row" id="row-cs-taper">
                                <label for="cs-taper">Taper</label>
                                <input type="range" id="cs-taper" min="0" max="100" value="68" step="1">
                                <span class="param-value" id="val-cs-taper">0.68</span>
                            </div>
                            <div class="control-row" id="row-cs-fill">
                                <label for="cs-fill">Space fill</label>
                                <input type="range" id="cs-fill" min="0" max="100" value="72" step="1">
                                <span class="param-value" id="val-cs-fill">0.72</span>
                            </div>
                            <div class="control-row color-row">
                                <label for="cs-bg">Background</label>
                                <input type="color" id="cs-bg" value="#ffffff">
                            </div>
                            <div class="control-row color-row">
                                <label for="cs-ink">Ink</label>
                                <input type="color" id="cs-ink" value="#000000">
                            </div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Effects</summary>
                        <section class="control-section">
                            <div class="control-row">
                                <label for="cs-texture-mode">Texture mode</label>
                                <select id="cs-texture-mode" class="select-input">
                                    <option value="none" selected>None</option>
                                    <option value="grid">Grid</option>
                                    <option value="grain">Grain</option>
                                    <option value="dots">Dots</option>
                                    <option value="pixel">Pixel</option>
                                </select>
                            </div>
                            <div class="control-row color-row" id="row-cs-texture-color">
                                <label for="cs-texture-color">Effect color</label>
                                <input type="color" id="cs-texture-color" value="#000000">
                            </div>
                            <div class="control-row" id="row-cs-texture-strength">
                                <label for="cs-texture-strength">Effect strength</label>
                                <input type="range" id="cs-texture-strength" min="0" max="100" value="80" step="1">
                                <span class="param-value" id="val-cs-texture-strength">0.80</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-density">
                                <label for="cs-texture-density">Density</label>
                                <input type="range" id="cs-texture-density" min="0" max="100" value="72" step="1">
                                <span class="param-value" id="val-cs-texture-density">0.72</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-size">
                                <label for="cs-texture-size">Size</label>
                                <input type="range" id="cs-texture-size" min="0" max="100" value="56" step="1">
                                <span class="param-value" id="val-cs-texture-size">0.56</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-opacity">
                                <label for="cs-texture-opacity">Opacity</label>
                                <input type="range" id="cs-texture-opacity" min="0" max="100" value="82" step="1">
                                <span class="param-value" id="val-cs-texture-opacity">0.82</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-jitter">
                                <label for="cs-texture-jitter">Jitter</label>
                                <input type="range" id="cs-texture-jitter" min="0" max="100" value="22" step="1">
                                <span class="param-value" id="val-cs-texture-jitter">0.22</span>
                            </div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>
    <script src="cyber.js"></script>
</body>
</html>
