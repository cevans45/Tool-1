<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber sigilism — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Cyber sigilism generator</span>
        </header>
        <div class="app" aria-label="Cyber sigilism generator">
            <div id="sigil-canvas"></div>
            <aside class="control-panel">
                <div class="mode-switch" id="cs-main-mode" style="margin:0;">
                    <button type="button" id="cs-mode-sketch" class="panel-button is-active">Sketch</button>
                    <button type="button" id="cs-mode-generate" class="panel-button">Generate</button>
                </div>
                <div class="panel-body">
                    <details class="control-window" id="section-sketch-core" open>
                        <summary>Draw</summary>
                        <section class="control-section">
                            <span class="control-row" style="margin-bottom:6px;">
                                <label>Brush</label>
                            </span>
                            <div class="mode-switch" style="margin-bottom:14px;">
                                <button type="button" id="cs-mode-ink" class="panel-button is-active">ADD +</button>
                                <button type="button" id="cs-mode-cut" class="panel-button">ERASE −</button>
                            </div>

                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-mirror-x" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror</span>
                            </label>

                            <!-- Size moved to Style -->

                            <div class="control-row" id="row-cs-sketch-reach">
                                <label for="cs-sketch-reach">Reach</label>
                                <input type="range" id="cs-sketch-reach" min="10" max="150" value="50" step="5">
                                <span class="param-value" id="val-cs-sketch-reach">50</span>
                            </div>

                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-branch-enabled-sketch">
                                <span class="toggle-box"></span>
                                <span class="cb-label">Branches</span>
                            </label>

                            <div class="control-row" id="row-cs-branching-sketch" style="display:none;">
                                <label for="cs-branching-sketch">Branch amt</label>
                                <input type="range" id="cs-branching-sketch" min="0" max="100" value="25" step="5">
                                <span class="param-value" id="val-cs-branching-sketch">25</span>
                            </div>
                            <div class="control-row" id="row-cs-branch-reach-sketch" style="display:none;">
                                <label for="cs-branch-reach-sketch">Branch reach</label>
                                <input type="range" id="cs-branch-reach-sketch" min="6" max="120" value="22" step="2">
                                <span class="param-value" id="val-cs-branch-reach-sketch">22</span>
                            </div>
                            <div class="control-row" id="row-cs-branch-count-sketch" style="display:none;">
                                <label for="cs-branch-count-sketch">Branch count</label>
                                <input type="range" id="cs-branch-count-sketch" min="0" max="6" value="2" step="1">
                                <span class="param-value" id="val-cs-branch-count-sketch">2</span>
                            </div>

                            <div class="control-row" style="gap:6px;">
                                <button type="button" id="cs-clear" class="panel-button">Clear</button>
                                <button type="button" id="cs-export" class="panel-button">Export PNG</button>
                            </div>

                            <div class="shortcuts-block">
                                <span>[1]</span> ADD &nbsp; <span>[2]</span> ERASE &nbsp; <span>[⌘Z]</span> UNDO<br>
                                <span>[M]</span> MIRROR &nbsp; <span>[SPACE]</span> CLEAR &nbsp; <span>[S]</span> EXPORT
                            </div>
                        </section>
                    </details>

                    <details class="control-window" id="section-sketch-style" open>
                        <summary>Style</summary>
                        <section class="control-section">
                            <div class="control-row">
                                <label for="cs-stroke">Size</label>
                                <input type="range" id="cs-stroke" min="1" max="12" value="2" step="1">
                                <span class="param-value" id="val-cs-stroke">2</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-stroke-style">Stroke style</label>
                                <select id="cs-stroke-style" class="select-input">
                                    <option value="line" selected>Line</option>
                                    <option value="sprinkle">Sprinkle</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <label for="cs-stroke-taper">Stroke taper</label>
                                <input type="range" id="cs-stroke-taper" min="0" max="100" value="35" step="5">
                                <span class="param-value" id="val-cs-stroke-taper">35</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-sketch-roughness">Roughness</label>
                                <input type="range" id="cs-sketch-roughness" min="0" max="20" value="4" step="1">
                                <span class="param-value" id="val-cs-sketch-roughness">4</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-sketch-density">Density</label>
                                <input type="range" id="cs-sketch-density" min="1" max="16" value="6" step="1">
                                <span class="param-value" id="val-cs-sketch-density">6</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-sketch-taper">Sketch taper</label>
                                <input type="range" id="cs-sketch-taper" min="0" max="100" value="25" step="5">
                                <span class="param-value" id="val-cs-sketch-taper">25</span>
                            </div>

                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-fill-enabled" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Fill</span>
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-outline-enabled">
                                <span class="toggle-box"></span>
                                <span class="cb-label">Outline</span>
                            </label>

                            <div class="control-row" id="row-cs-outline-width" style="display:none;">
                                <label for="cs-outline-width">Outline width</label>
                                <input type="range" id="cs-outline-width" min="1" max="8" value="2" step="1">
                                <span class="param-value" id="val-cs-outline-width">2</span>
                            </div>

                            <div class="control-row color-row" id="row-cs-outline-color" style="display:none;">
                                <label for="cs-outline-color">Outline color</label>
                                <input type="color" id="cs-outline-color" value="#888888">
                            </div>

                            <div class="control-row color-row">
                                <label for="cs-bg-sketch">Background</label>
                                <input type="color" id="cs-bg-sketch" value="#ffffff">
                            </div>
                            <div class="control-row color-row">
                                <label for="cs-ink-sketch">Ink</label>
                                <input type="color" id="cs-ink-sketch" value="#000000">
                            </div>
                        </section>
                    </details>

                    <details class="control-window" id="section-structure" open>
                        <summary>Generate</summary>
                        <section class="control-section">
                            <div class="control-row" style="gap:6px; margin-bottom:12px;">
                                <button type="button" id="cs-regenerate" class="panel-button" style="flex:1;">Regenerate</button>
                                <button type="button" id="cs-random-seed" class="panel-button" style="flex:1;">Random</button>
                                <button type="button" id="cs-export-gen" class="panel-button">Export</button>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-mirror-x-gen" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror X</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-mirror-y">
                                <span class="toggle-box"></span>
                                <span class="cb-label">Mirror Y</span>
                            </label>
                            <div class="control-row">
                                <label for="cs-seed">Seed</label>
                                <input type="number" id="cs-seed" min="0" max="999999999" value="0" step="1">
                            </div>
                            <div class="control-row">
                                <label for="cs-curves">Curves</label>
                                <input type="range" id="cs-curves" min="2" max="12" value="5" step="1">
                                <span class="param-value" id="val-cs-curves">5</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-curve-amt">Curve</label>
                                <input type="range" id="cs-curve-amt" min="0" max="100" value="55" step="5">
                                <span class="param-value" id="val-cs-curve-amt">55</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-spread">Spread</label>
                                <input type="range" id="cs-spread" min="10" max="100" value="50" step="5">
                                <span class="param-value" id="val-cs-spread">50</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-gen-reach">Reach</label>
                                <input type="range" id="cs-gen-reach" min="60" max="220" value="120" step="5">
                                <span class="param-value" id="val-cs-gen-reach">120</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-gen-webbing">Webbing</label>
                                <input type="range" id="cs-gen-webbing" min="0" max="100" value="45" step="5">
                                <span class="param-value" id="val-cs-gen-webbing">45</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-gen-taper">Taper</label>
                                <input type="range" id="cs-gen-taper" min="0" max="100" value="65" step="5">
                                <span class="param-value" id="val-cs-gen-taper">65</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-branching">Branching</label>
                                <input type="range" id="cs-branching" min="0" max="100" value="30" step="5">
                                <span class="param-value" id="val-cs-branching">30</span>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" id="cs-branch-enabled-gen" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Branches</span>
                            </label>
                            <div class="control-row">
                                <label for="cs-branch-reach-gen">Branch reach</label>
                                <input type="range" id="cs-branch-reach-gen" min="8" max="160" value="48" step="2">
                                <span class="param-value" id="val-cs-branch-reach-gen">48</span>
                            </div>
                            <div class="control-row">
                                <label for="cs-branch-count-gen">Branch count</label>
                                <input type="range" id="cs-branch-count-gen" min="0" max="6" value="2" step="1">
                                <span class="param-value" id="val-cs-branch-count-gen">2</span>
                            </div>
                            <!-- Size moved to Style -->
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Effects</summary>
                        <section class="control-section">
                            <div class="control-row">
                                <label for="cs-texture-mode">Texture mode</label>
                                <select id="cs-texture-mode" class="select-input">
                                    <option value="none" selected>None</option>
                                    <option value="grid">Grid</option>
                                    <option value="grain">Grain</option>
                                    <option value="dots">Dots</option>
                                    <option value="pixel">Pixel</option>
                                </select>
                            </div>
                            <div class="control-row color-row" id="row-cs-texture-color">
                                <label for="cs-texture-color">Effect color</label>
                                <input type="color" id="cs-texture-color" value="#000000">
                            </div>
                            <div class="control-row" id="row-cs-texture-strength">
                                <label for="cs-texture-strength">Effect strength</label>
                                <input type="range" id="cs-texture-strength" min="0" max="100" value="80" step="1">
                                <span class="param-value" id="val-cs-texture-strength">0.80</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-density">
                                <label for="cs-texture-density">Density</label>
                                <input type="range" id="cs-texture-density" min="0" max="100" value="72" step="1">
                                <span class="param-value" id="val-cs-texture-density">0.72</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-size">
                                <label for="cs-texture-size">Size</label>
                                <input type="range" id="cs-texture-size" min="0" max="100" value="56" step="1">
                                <span class="param-value" id="val-cs-texture-size">0.56</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-opacity">
                                <label for="cs-texture-opacity">Opacity</label>
                                <input type="range" id="cs-texture-opacity" min="0" max="100" value="82" step="1">
                                <span class="param-value" id="val-cs-texture-opacity">0.82</span>
                            </div>
                            <div class="control-row" id="row-cs-texture-jitter">
                                <label for="cs-texture-jitter">Jitter</label>
                                <input type="range" id="cs-texture-jitter" min="0" max="100" value="22" step="1">
                                <span class="param-value" id="val-cs-texture-jitter">0.22</span>
                            </div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>
    <script src="cyber.js"></script>
</body>
</html>
