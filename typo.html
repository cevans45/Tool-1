<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typo — OVRT</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Typo</span>
        </header>

        <div class="app" aria-label="Typo">
            <div id="sketch-container">
                <canvas id="canvas"></canvas>
                <div id="drop-overlay" hidden>Drop .ttf / .otf / .woff here</div>
            </div>

            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Controls</h2>
                </header>

                <div class="panel-body">
                    <details class="control-window" open>
                        <summary>Type pad</summary>
                        <section class="control-section">
                            <div class="control-row" style="flex-direction:column;gap:4px;">
                                <label for="ty-text">Text</label>
                                <textarea id="ty-text" rows="3" spellcheck="false"
                                    style="width:100%;resize:vertical;font-family:inherit;font-size:11px;padding:6px 8px;border:1px solid var(--border,#333);border-radius:4px;background:var(--surface-2,#1a1a1a);color:inherit;">TYPO</textarea>
                            </div>
                            <div class="control-row" style="margin-top:4px;">
                                <label for="ty-font-size">Font size</label>
                                <input type="range" id="ty-font-size" min="20" max="400" value="140" step="1">
                                <span class="param-value" id="val-ty-font-size">140</span>
                            </div>
                            <div class="control-row">
                                <label for="ty-spacing">Spacing</label>
                                <input type="range" id="ty-spacing" min="-10" max="40" value="0" step="1">
                                <span class="param-value" id="val-ty-spacing">0</span>
                            </div>
                            <div class="control-row">
                                <label for="ty-line-h">Line height</label>
                                <input type="range" id="ty-line-h" min="0.6" max="3.0" value="1.2" step="0.05">
                                <span class="param-value" id="val-ty-line-h">1.20</span>
                            </div>
                            <div class="control-row" style="margin-bottom:8px;">
                                <label>Align</label>
                                <div class="mode-switch" style="width:100%;margin:0;">
                                    <button type="button" class="panel-button" data-align="left">L</button>
                                    <button type="button" class="panel-button is-active" data-align="center">C</button>
                                    <button type="button" class="panel-button" data-align="right">R</button>
                                </div>
                            </div>
                            <div class="control-row" style="margin-top:4px;flex-direction:column;gap:4px;">
                                <label>Font</label>
                                <div id="ty-font-label"
                                    style="font-size:10px;opacity:0.6;padding:4px 0;">System default — drop
                                    .ttf/.otf/.woff onto canvas</div>
                                <button type="button" id="ty-font-reset" class="panel-button"
                                    style="display:none;">Reset font</button>
                            </div>
                        </section>
                    </details>

                    <details class="control-window" open>
                        <summary>Construct</summary>
                        <section class="control-section">
                            <div class="control-row">
                                <label for="ty-mode">Mode</label>
                                <select id="ty-mode" class="select-input">
                                    <option value="none">None</option>
                                    <option value="net" selected>Net</option>
                                    <option value="stroke">Stroke</option>
                                    <option value="fragment">Fragment</option>
                                    <option value="grain">Grain</option>
                                    <option value="blob">Blob</option>
                                    <option value="halftone">Halftone</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <label for="ty-density">Density</label>
                                <input type="range" id="ty-density" min="1" max="20" value="8" step="1">
                                <span class="param-value" id="val-ty-density">8</span>
                            </div>
                            <div class="control-row">
                                <label for="ty-scale">Scale</label>
                                <input type="range" id="ty-scale" min="1" max="30" value="12" step="1">
                                <span class="param-value" id="val-ty-scale">12</span>
                            </div>
                            <div class="control-row">
                                <label for="ty-jitter">Jitter</label>
                                <input type="range" id="ty-jitter" min="0" max="100" value="55" step="1">
                                <span class="param-value" id="val-ty-jitter">55</span>
                            </div>
                            <div class="control-row">
                                <label for="ty-weight">Weight</label>
                                <input type="range" id="ty-weight" min="1" max="20" value="6" step="1">
                                <span class="param-value" id="val-ty-weight">6</span>
                            </div>
                            <div class="control-row color-row">
                                <label for="ty-ink">Ink color</label>
                                <input type="color" id="ty-ink" value="#111111">
                            </div>
                            <div class="control-row color-row">
                                <label for="ty-bg">Background</label>
                                <input type="color" id="ty-bg" value="#f0ede8">
                            </div>
                            <div class="control-row" style="gap:6px;margin-top:8px;">
                                <button type="button" id="ty-export" class="panel-button">Export PNG</button>
                            </div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>

    <style>
        .app[aria-label="Typo"] {
            height: calc(100vh - 56px);
            min-height: calc(100vh - 56px);
            padding: 0; gap: 0;
            align-items: stretch;
            justify-content: flex-start;
        }
        .app[aria-label="Typo"] #sketch-container {
            flex: 1; height: 100%; width: 100%;
            min-width: 0; pointer-events: auto; position: relative;
        }
        .app[aria-label="Typo"] #sketch-container canvas {
            width: 100%; height: 100%; display: block; touch-action: none;
        }
        .app[aria-label="Typo"] .control-panel { width: 280px; }
        .app[aria-label="Typo"] .control-row { gap: 8px; }
        .app[aria-label="Typo"] .control-row label { flex: 0 0 90px; }
        .app[aria-label="Typo"] .panel-body { max-height: none; }
        #drop-overlay {
            position: absolute; inset: 0;
            align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #fff;
            background: rgba(0,0,0,0.55);
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 8px; pointer-events: none; z-index: 10;
            display: none;
        }
        #drop-overlay:not([hidden]) {
            display: flex;
        }
    </style>

    <script src="page-transition.js"></script>
    <script>
    if (new URLSearchParams(location.search).get('preview') === '1')
        document.body.classList.add('is-preview');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const srcCanvas = document.createElement('canvas');
    const srcCtx = srcCanvas.getContext('2d');
    let cssW = 1, cssH = 1, dpr = 1;
    const $ = id => document.getElementById(id);

    const S = {
        text: 'TYPO', fontSize: 140, letterSpacing: 0, lineHeight: 1.2,
        textAlign: 'center', fontFamily: 'sans-serif', fontFileName: null,
        mode: 'net', density: 8, scale: 12, jitter: 55, weight: 6,
        ink: '#111111', bg: '#f0ede8',
    };

    // ─── Point system ────────────────────────────────────────────

    let pts = [];
    let connections = [];
    let alphaData = null;
    let alphaW = 0, alphaH = 0;
    let animId = null;
    let needsRecompute = true;

    function fontStr() { return S.fontSize + 'px ' + S.fontFamily; }

    function drawTextLine(c, text, x, y) {
        if (S.letterSpacing === 0) { c.fillText(text, x, y); return; }
        const totalW = measureW(c, text);
        let cx = x;
        if (c.textAlign === 'center') cx -= totalW / 2;
        else if (c.textAlign === 'right') cx -= totalW;
        const saved = c.textAlign; c.textAlign = 'left';
        for (let i = 0; i < text.length; i++) {
            c.fillText(text[i], cx, y);
            cx += c.measureText(text[i]).width + S.letterSpacing;
        }
        c.textAlign = saved;
    }

    function measureW(c, text) {
        if (S.letterSpacing === 0) return c.measureText(text).width;
        let w = 0;
        for (let i = 0; i < text.length; i++) {
            w += c.measureText(text[i]).width;
            if (i < text.length - 1) w += S.letterSpacing;
        }
        return w;
    }

    function renderSource() {
        srcCanvas.width = canvas.width;
        srcCanvas.height = canvas.height;
        srcCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        srcCtx.clearRect(0, 0, cssW, cssH);
        srcCtx.font = fontStr();
        srcCtx.textAlign = S.textAlign;
        srcCtx.textBaseline = 'middle';
        srcCtx.fillStyle = '#000';
        const lines = S.text.split('\n');
        const lineH = S.fontSize * S.lineHeight;
        const totalH = (lines.length - 1) * lineH;
        const startY = cssH / 2 - totalH / 2;
        const x = S.textAlign === 'left' ? 40 : S.textAlign === 'right' ? cssW - 40 : cssW / 2;
        for (let i = 0; i < lines.length; i++) {
            drawTextLine(srcCtx, lines[i], x, startY + i * lineH);
        }
    }

    function extractAlpha() {
        const d = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height).data;
        alphaW = srcCanvas.width;
        alphaH = srcCanvas.height;
        alphaData = new Uint8Array(alphaW * alphaH);
        for (let i = 0; i < alphaW * alphaH; i++) alphaData[i] = d[i * 4 + 3];
    }

    function inside(cx, cy) {
        const px = Math.round(cx * dpr), py = Math.round(cy * dpr);
        if (px < 0 || px >= alphaW || py < 0 || py >= alphaH) return false;
        return alphaData[py * alphaW + px] > 100;
    }

    function isEdge(px, py) {
        if (px < 1 || px >= alphaW - 1 || py < 1 || py >= alphaH - 1) return false;
        const a = alphaData[py * alphaW + px];
        if (a < 100) return false;
        return alphaData[(py - 1) * alphaW + px] < 100 ||
               alphaData[(py + 1) * alphaW + px] < 100 ||
               alphaData[py * alphaW + px - 1] < 100 ||
               alphaData[py * alphaW + px + 1] < 100;
    }

    function recompute() {
        renderSource();
        extractAlpha();

        const spacing = Math.max(2, 22 - S.density * 2);
        const step = Math.max(2, Math.round(spacing * dpr));
        const scatter = S.scale * 0.45;
        pts = [];

        function makePt(px, py, edge, stray) {
            const gx = (alphaData[py * alphaW + Math.min(px + 1, alphaW - 1)] - alphaData[py * alphaW + Math.max(px - 1, 0)]) / 510;
            const gy = (alphaData[Math.min(py + 1, alphaH - 1) * alphaW + px] - alphaData[Math.max(py - 1, 0) * alphaW + px]) / 510;
            const glen = Math.sqrt(gx * gx + gy * gy) || 1;

            const randOff = scatter * (0.3 + Math.random() * 0.7);
            const randAng = Math.random() * Math.PI * 2;
            const driftX = Math.cos(randAng) * randOff;
            const driftY = Math.sin(randAng) * randOff;

            const bx = px / dpr + driftX;
            const by = py / dpr + driftY;

            pts.push({
                bx, by, x: bx, y: by,
                tx: gy / glen, ty: -gx / glen,
                nx: -gx / glen, ny: -gy / glen,
                edge, stray: !!stray,
                phase: Math.random() * Math.PI * 2,
                phase2: Math.random() * Math.PI * 2,
                size: 0.3 + Math.random() * 0.7,
                rot: Math.random() * Math.PI * 2,
                driftX: (Math.random() - 0.5) * scatter * 1.5,
                driftY: (Math.random() - 0.5) * scatter * 1.5,
                speed: 0.6 + Math.random() * 0.8,
            });
        }

        for (let py = 2; py < alphaH - 2; py += step) {
            for (let px = 2; px < alphaW - 2; px += step) {
                const a = alphaData[py * alphaW + px];
                if (a < 100) continue;
                const edge = isEdge(px, py);
                makePt(px, py, edge, false);

                if (edge && Math.random() < 0.55) {
                    const gx = (alphaData[py * alphaW + Math.min(px + 1, alphaW - 1)] - alphaData[py * alphaW + Math.max(px - 1, 0)]) / 510;
                    const gy = (alphaData[Math.min(py + 1, alphaH - 1) * alphaW + px] - alphaData[Math.max(py - 1, 0) * alphaW + px]) / 510;
                    const glen = Math.sqrt(gx * gx + gy * gy) || 1;
                    const nx = -gx / glen, ny = -gy / glen;
                    const esc = scatter * (1.0 + Math.random() * 2.0);
                    const spx = Math.round(px + nx * esc * dpr);
                    const spy = Math.round(py + ny * esc * dpr);
                    if (spx > 0 && spx < alphaW - 1 && spy > 0 && spy < alphaH - 1) {
                        makePt(spx, spy, true, true);
                    }
                }
            }
        }

        buildConnections();
        needsRecompute = false;
    }

    function buildConnections() {
        const radius = S.scale * 3.5;
        const cellSize = radius;
        const grid = {};

        for (let i = 0; i < pts.length; i++) {
            const cx = Math.floor(pts[i].bx / cellSize);
            const cy = Math.floor(pts[i].by / cellSize);
            const key = cx + ',' + cy;
            if (!grid[key]) grid[key] = [];
            grid[key].push(i);
        }

        connections = [];
        for (let i = 0; i < pts.length; i++) {
            const cx = Math.floor(pts[i].bx / cellSize);
            const cy = Math.floor(pts[i].by / cellSize);
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const cell = grid[(cx + dx) + ',' + (cy + dy)];
                    if (!cell) continue;
                    for (const j of cell) {
                        if (j <= i) continue;
                        const d = Math.hypot(pts[i].bx - pts[j].bx, pts[i].by - pts[j].by);
                        if (d < radius && d > 0.5) {
                            connections.push({ a: i, b: j, d });
                        }
                    }
                }
            }
        }
    }

    // ─── Scratchy line (Elemenyt-style) ──────────────────────────

    function scratchLine(x1, y1, x2, y2, dist, thick) {
        if (dist < 0.5) return;
        const segs = Math.max(2, Math.floor(dist / 1.2));
        const dx = x2 - x1, dy = y2 - y1;
        const nx = -dy / dist, ny = dx / dist;

        ctx.beginPath();
        ctx.moveTo(x1 + (Math.random() - 0.5) * thick * 0.5,
                   y1 + (Math.random() - 0.5) * thick * 0.5);
        for (let s = 1; s <= segs; s++) {
            const t = s / segs;
            const jAmp = thick * 0.45;
            ctx.lineTo(
                x1 + dx * t + (Math.random() - 0.5) * jAmp + (Math.random() - 0.5) * jAmp * nx,
                y1 + dy * t + (Math.random() - 0.5) * jAmp + (Math.random() - 0.5) * jAmp * ny
            );
        }
        ctx.stroke();
    }

    // ─── Drawing modes ───────────────────────────────────────────

    function drawNone() {
        ctx.font = fontStr();
        ctx.textAlign = S.textAlign;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = S.ink;
        const lines = S.text.split('\n');
        const lineH = S.fontSize * S.lineHeight;
        const totalH = (lines.length - 1) * lineH;
        const startY = cssH / 2 - totalH / 2;
        const x = S.textAlign === 'left' ? 40 : S.textAlign === 'right' ? cssW - 40 : cssW / 2;
        for (let i = 0; i < lines.length; i++) {
            drawTextLine(ctx, lines[i], x, startY + i * lineH);
        }
    }

    function drawNet() {
        const thick = S.weight * 0.2;
        const maxDist = S.scale * 3.5;

        ctx.strokeStyle = S.ink;
        ctx.lineCap = 'round';

        for (const c of connections) {
            const a = pts[c.a], b = pts[c.b];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d > maxDist * 1.6) continue;
            const fade = Math.max(0.05, 1 - d / (maxDist * 1.3));
            ctx.globalAlpha = fade * 0.65;
            ctx.lineWidth = thick * fade * (0.4 + (a.edge || b.edge ? 1.0 : 0.3));
            scratchLine(a.x, a.y, b.x, b.y, d, thick * 3);
        }

        ctx.fillStyle = S.ink;
        for (const p of pts) {
            if (!p.edge && Math.random() > 0.3) continue;
            const r = thick * (0.3 + p.size * 0.6) * (p.stray ? 1.4 : 1);
            ctx.globalAlpha = p.stray ? 0.4 + Math.random() * 0.3 : 0.75;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function drawStroke() {
        const thick = S.weight * 0.35;

        ctx.strokeStyle = S.ink;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const edgePts = pts.filter(p => p.edge);

        for (let pass = 0; pass < 4; pass++) {
            const jAmp = (pass + 1) * thick * 0.6;
            ctx.lineWidth = thick * (1.4 - pass * 0.25);
            ctx.globalAlpha = 0.45 - pass * 0.08;

            ctx.beginPath();
            let penDown = false;
            for (let i = 0; i < edgePts.length; i++) {
                const p = edgePts[i];
                const next = edgePts[i + 1];
                const jx = (Math.random() - 0.5) * jAmp + p.driftX * 0.3;
                const jy = (Math.random() - 0.5) * jAmp + p.driftY * 0.3;

                if (!next || Math.hypot(p.x - next.x, p.y - next.y) > S.scale * 4) {
                    if (penDown) ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(p.x + jx, p.y + jy);
                    penDown = true;
                } else {
                    ctx.lineTo(p.x + jx, p.y + jy);
                }
            }
            if (penDown) ctx.stroke();
        }

        ctx.lineWidth = thick * 0.5;
        const fillPts = pts.filter(p => !p.edge);
        for (const p of fillPts) {
            if (Math.random() > 0.45) continue;
            const len = S.scale * 1.2 * p.size;
            const angJitter = (Math.random() - 0.5) * 0.8;
            const tx = p.tx * Math.cos(angJitter) - p.ty * Math.sin(angJitter);
            const ty = p.tx * Math.sin(angJitter) + p.ty * Math.cos(angJitter);
            ctx.globalAlpha = 0.15 + Math.random() * 0.15;
            ctx.beginPath();
            ctx.moveTo(p.x - tx * len, p.y - ty * len);
            ctx.lineTo(p.x + tx * len, p.y + ty * len);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    function drawFragment() {
        const sz = S.scale * 0.85;
        const thick = S.weight * 0.1;

        ctx.strokeStyle = S.ink;
        ctx.fillStyle = S.ink;
        ctx.lineWidth = thick;
        ctx.lineJoin = 'miter';

        for (const p of pts) {
            const sides = 3 + Math.floor(p.size * 4);
            const r = sz * (0.3 + p.size * 0.9) * (p.stray ? 1.3 : 1);
            const rot = p.rot + p.phase * 0.5;
            const alpha = p.edge ? 0.65 : (p.stray ? 0.3 : 0.25);
            ctx.globalAlpha = alpha;

            ctx.beginPath();
            for (let v = 0; v <= sides; v++) {
                const a = (Math.PI * 2 / sides) * v + rot;
                const wobble = 0.5 + Math.sin(a * 2.7 + p.phase) * 0.35
                             + Math.cos(a * 4.1 + p.phase2) * 0.15;
                const vr = r * wobble;
                const vx = p.x + Math.cos(a) * vr + (Math.random() - 0.5) * sz * 0.2;
                const vy = p.y + Math.sin(a) * vr + (Math.random() - 0.5) * sz * 0.2;
                if (v === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();

            if (p.edge || Math.random() < 0.4) {
                ctx.fill();
            } else {
                ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;
    }

    function drawGrain() {
        ctx.fillStyle = S.ink;
        const maxR = S.weight * 0.16;
        const spread = S.scale * 1.4;

        for (const p of pts) {
            const count = p.edge ? 6 : 3;
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const dist = Math.random() * spread * (0.3 + p.size);
                const ox = Math.cos(ang) * dist;
                const oy = Math.sin(ang) * dist;
                const r = maxR * (0.2 + Math.random() * 0.8) * p.size;
                ctx.globalAlpha = p.edge ? 0.5 + Math.random() * 0.35 : 0.15 + Math.random() * 0.2;
                ctx.beginPath();
                ctx.arc(p.x + ox, p.y + oy, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    function drawBlob() {
        ctx.fillStyle = S.ink;
        const baseR = S.scale * 0.7;

        for (const p of pts) {
            if (!p.edge && Math.random() > 0.6) continue;
            const r = baseR * (0.4 + p.size * 1.0) * (p.stray ? 1.3 : 1);
            const wobbleN = 3 + Math.floor(p.size * 5);
            ctx.globalAlpha = p.edge ? 0.5 : (p.stray ? 0.2 : 0.18);

            ctx.beginPath();
            const steps = 24;
            for (let i = 0; i <= steps; i++) {
                const a = (Math.PI * 2 / steps) * i;
                const wobble = 1 + Math.sin(a * wobbleN + p.phase) * 0.4
                             + Math.cos(a * (wobbleN + 3) + p.phase2) * 0.25
                             + Math.sin(a * 1.5 + p.rot) * 0.15;
                const vx = p.x + Math.cos(a) * r * wobble;
                const vy = p.y + Math.sin(a) * r * wobble;
                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function drawHalftone() {
        const sp = Math.max(3, Math.round(S.scale * dpr));
        ctx.fillStyle = S.ink;
        for (let cy = Math.floor(sp / 2); cy < alphaH; cy += sp) {
            for (let cx = Math.floor(sp / 2); cx < alphaW; cx += sp) {
                let sum = 0, cnt = 0;
                const r2 = Math.max(1, Math.floor(sp / 2));
                for (let dy = -r2; dy < r2; dy++) {
                    for (let dx = -r2; dx < r2; dx++) {
                        const px = cx + dx, py = cy + dy;
                        if (px >= 0 && px < alphaW && py >= 0 && py < alphaH) {
                            sum += alphaData[py * alphaW + px]; cnt++;
                        }
                    }
                }
                const a = cnt > 0 ? sum / cnt / 255 : 0;
                if (a < 0.03) continue;
                const rad = sp * 0.48 * Math.sqrt(a);
                ctx.beginPath();
                ctx.arc(cx / dpr, cy / dpr, rad / dpr, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    const modes = {
        none: drawNone, net: drawNet, stroke: drawStroke,
        fragment: drawFragment, grain: drawGrain, blob: drawBlob,
        halftone: drawHalftone,
    };

    // ─── Animation loop ──────────────────────────────────────────

    function tick() {
        if (!animId) return;

        const t = performance.now() / 1000;
        const jAmp = S.jitter * 0.12 * (S.scale * 0.2 + 0.6);

        for (const p of pts) {
            const sp = p.speed;
            const jx = Math.sin(t * 2.1 * sp + p.phase) * jAmp
                      + Math.sin(t * 5.3 * sp + p.phase2) * jAmp * 0.45
                      + Math.sin(t * 0.7 + p.phase * 3) * jAmp * 0.6;
            const jy = Math.cos(t * 1.7 * sp + p.phase2) * jAmp
                      + Math.cos(t * 4.1 * sp + p.phase) * jAmp * 0.45
                      + Math.cos(t * 0.9 + p.phase2 * 2) * jAmp * 0.6;
            const driftScale = S.jitter * 0.008;
            p.x = p.bx + jx + p.driftX * driftScale * Math.sin(t * 0.4 + p.phase);
            p.y = p.by + jy + p.driftY * driftScale * Math.cos(t * 0.3 + p.phase2);
            p.rot += (Math.sin(t * sp + p.phase) * 0.008) * (S.jitter * 0.02);
        }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = S.bg;
        ctx.fillRect(0, 0, cssW, cssH);

        const fn = modes[S.mode];
        if (fn) fn();

        animId = requestAnimationFrame(tick);
    }

    function startAnim() {
        if (animId) return;
        animId = requestAnimationFrame(tick);
    }

    function stopAnim() {
        if (animId) { cancelAnimationFrame(animId); animId = null; }
    }

    function fullRender() {
        if (needsRecompute) recompute();

        const animated = S.mode !== 'none' && S.mode !== 'halftone';

        if (animated && S.jitter > 0) {
            startAnim();
        } else {
            stopAnim();
            for (const p of pts) { p.x = p.bx; p.y = p.by; }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = S.bg;
            ctx.fillRect(0, 0, cssW, cssH);
            const fn = modes[S.mode];
            if (fn) fn();
        }
    }

    function paramChanged() {
        needsRecompute = true;
        if (animId) {
            recompute();
        } else {
            fullRender();
        }
    }

    function modeChanged() {
        stopAnim();
        if (needsRecompute) recompute();
        fullRender();
    }

    // ─── Resize ──────────────────────────────────────────────────

    function resize() {
        const container = document.getElementById('sketch-container');
        const rect = container.getBoundingClientRect();
        let w = rect.width, h = rect.height;
        if (!Number.isFinite(w) || w < 10) w = innerWidth;
        if (!Number.isFinite(h) || h < 10) h = innerHeight;
        cssW = w; cssH = h;
        dpr = Math.max(1, devicePixelRatio || 1);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        needsRecompute = true;
        fullRender();
    }

    addEventListener('resize', () => requestAnimationFrame(resize));

    // ─── Font drag-and-drop ──────────────────────────────────────

    const sketchC = document.getElementById('sketch-container');
    const dropOv = $('drop-overlay');
    let dragN = 0;
    sketchC.addEventListener('dragenter', e => { e.preventDefault(); dragN++; dropOv.hidden = false; });
    sketchC.addEventListener('dragleave', () => { dragN--; if (dragN <= 0) { dragN = 0; dropOv.hidden = true; } });
    sketchC.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    sketchC.addEventListener('drop', async e => {
        e.preventDefault(); dragN = 0; dropOv.hidden = true;
        const file = e.dataTransfer.files[0];
        if (!file || !/\.(ttf|otf|woff2?|TTF|OTF|WOFF2?)$/.test(file.name)) return;
        try {
            const buf = await file.arrayBuffer();
            const name = 'CustomFont_' + Date.now();
            const face = new FontFace(name, buf);
            await face.load();
            document.fonts.add(face);
            S.fontFamily = name; S.fontFileName = file.name;
            $('ty-font-label').textContent = file.name;
            $('ty-font-reset').style.display = '';
            paramChanged();
        } catch (err) { console.error('Font load failed:', err); }
    });

    function exportPNG() {
        const link = document.createElement('a');
        link.download = 'typo_export.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // ─── UI Wiring ───────────────────────────────────────────────

    $('ty-text').addEventListener('input', e => { S.text = e.target.value; paramChanged(); });
    $('ty-font-size').addEventListener('input', e => {
        S.fontSize = +e.target.value; $('val-ty-font-size').textContent = S.fontSize; paramChanged();
    });
    $('ty-spacing').addEventListener('input', e => {
        S.letterSpacing = +e.target.value; $('val-ty-spacing').textContent = S.letterSpacing; paramChanged();
    });
    $('ty-line-h').addEventListener('input', e => {
        S.lineHeight = +e.target.value; $('val-ty-line-h').textContent = S.lineHeight.toFixed(2); paramChanged();
    });
    document.querySelectorAll('[data-align]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-align]').forEach(b => b.classList.remove('is-active'));
            btn.classList.add('is-active');
            S.textAlign = btn.dataset.align; paramChanged();
        });
    });
    $('ty-font-reset').addEventListener('click', () => {
        S.fontFamily = 'sans-serif'; S.fontFileName = null;
        $('ty-font-label').textContent = 'System default — drop .ttf/.otf/.woff onto canvas';
        $('ty-font-reset').style.display = 'none'; paramChanged();
    });
    $('ty-mode').addEventListener('change', e => { S.mode = e.target.value; modeChanged(); });
    $('ty-density').addEventListener('input', e => {
        S.density = +e.target.value; $('val-ty-density').textContent = S.density; paramChanged();
    });
    $('ty-scale').addEventListener('input', e => {
        S.scale = +e.target.value; $('val-ty-scale').textContent = S.scale;
        buildConnections();
        if (!animId) fullRender();
    });
    $('ty-jitter').addEventListener('input', e => {
        S.jitter = +e.target.value; $('val-ty-jitter').textContent = S.jitter;
        fullRender();
    });
    $('ty-weight').addEventListener('input', e => {
        S.weight = +e.target.value; $('val-ty-weight').textContent = S.weight;
        if (!animId) fullRender();
    });
    $('ty-ink').addEventListener('input', e => { S.ink = e.target.value; if (!animId) fullRender(); });
    $('ty-bg').addEventListener('input', e => {
        S.bg = e.target.value;
        document.querySelector('.app[aria-label="Typo"]').style.backgroundColor = S.bg;
        if (!animId) fullRender();
    });
    $('ty-export').addEventListener('click', exportPNG);

    // ─── Init ────────────────────────────────────────────────────

    document.querySelector('.app[aria-label="Typo"]').style.backgroundColor = S.bg;
    resize();
    requestAnimationFrame(resize);
    </script>
</body>
</html>
