<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle recursion — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Particle recursion</span>
        </header>
        <div class="app" aria-label="Particle recursion">
            <div id="particle-canvas"></div>
            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Controls</h2>
                </header>
                <div class="panel-body">
                    <section class="control-section">
                        <h3>Layout</h3>
                        <div class="control-row">
                            <label for="pr-tiles">Tiles</label>
                            <select id="pr-tiles" class="select-input">
                                <option value="single" selected>Single</option>
                                <option value="row">Row of 3</option>
                                <option value="grid">Grid of 9</option>
                            </select>
                        </div>
                        <div class="control-row">
                            <label for="pr-cell">Cell scale</label>
                            <input type="range" id="pr-cell" min="30" max="90" value="65" step="1">
                            <span class="param-value" id="val-pr-cell">65%</span>
                        </div>
                    </section>

                    <section class="control-section">
                        <h3>Pattern</h3>
                        <div class="control-row">
                            <label for="pr-depth">Max depth</label>
                            <input type="range" id="pr-depth" min="3" max="10" value="7" step="1">
                            <span class="param-value" id="val-pr-depth">7</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-branches">Branches</label>
                            <input type="range" id="pr-branches" min="3" max="10" value="5" step="1">
                            <span class="param-value" id="val-pr-branches">5</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-radius">Radius</label>
                            <input type="range" id="pr-radius" min="5" max="35" value="15" step="1">
                            <span class="param-value" id="val-pr-radius">0.15</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-id">ID</label>
                            <input type="range" id="pr-id" min="0" max="1000" value="500" step="1">
                            <span class="param-value" id="val-pr-id">0.50</span>
                        </div>
                    </section>

                    <section class="control-section">
                        <h3>Palette</h3>
                        <div class="control-row">
                            <label for="pr-pa">PA</label>
                            <input type="range" id="pr-pa" min="10" max="50" value="30" step="1">
                            <span class="param-value" id="val-pr-pa">0.30</span>
                        </div>
                        <div class="control-row color-row">
                            <label for="pr-pb">PB</label>
                            <input type="range" id="pr-pb" min="10" max="50" value="30" step="1">
                            <span class="param-value" id="val-pr-pb">0.30</span>
                        </div>
                        <div class="control-row color-row">
                            <label for="pr-pc">PC</label>
                            <input type="range" id="pr-pc" min="1" max="3" value="2" step="1">
                            <span class="param-value" id="val-pr-pc">2</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-pd">PD</label>
                            <input type="range" id="pr-pd" min="0" max="100" value="50" step="1">
                            <span class="param-value" id="val-pr-pd">0.50</span>
                        </div>
                        <div class="control-row">
                            <label>Palette</label>
                            <button type="button" id="pr-random-palette" class="panel-button">Random palette</button>
                        </div>
                    </section>
                    <section class="control-section">
                        <h3>Seed & motion</h3>
                        <div class="control-row">
                            <label for="pr-seed">Seed</label>
                            <input type="number" id="pr-seed" min="0" max="999999999" value="123456" step="1">
                        </div>
                        <div class="control-row">
                            <label>Seed</label>
                            <button type="button" id="pr-random-seed" class="panel-button">Random seed</button>
                        </div>
                        <div class="control-row">
                            <label for="pr-animate">Animate</label>
                            <input type="checkbox" id="pr-animate" checked>
                        </div>
                        <div class="control-row">
                            <label for="pr-motion">Motion</label>
                            <input type="range" id="pr-motion" min="0" max="100" value="20" step="1">
                            <span class="param-value" id="val-pr-motion">0.20</span>
                        </div>
                    </section>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>
    <script src="particles.js"></script>
</body>
</html>
