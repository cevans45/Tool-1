<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive particles — OVRT</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Recursive particles</span>
        </header>
        <div class="app" aria-label="Recursive particles">
            <div id="particle-canvas"></div>
            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Controls</h2>
                </header>
                <div class="panel-body">
                    <section class="control-section">
                        <h3>Seed & palette</h3>
                        <div class="control-row">
                            <label for="pr-seed">Seed</label>
                            <input type="number" id="pr-seed" min="0" max="999999999" value="123456" step="1">
                        </div>
                        <div class="control-row">
                            <label>Seed action</label>
                            <button type="button" id="pr-random-seed" class="panel-button">Random seed</button>
                        </div>
                        <div class="control-row">
                            <label>Palette</label>
                            <button type="button" id="pr-random-palette" class="panel-button">Random palette</button>
                        </div>
                        <div class="control-row color-row">
                            <label for="pr-bg">Background</label>
                            <input type="color" id="pr-bg" value="#000000">
                        </div>
                    </section>

                    <section class="control-section">
                        <h3>Core</h3>
                        <div class="control-row">
                            <label for="pr-pa">pa</label>
                            <input type="range" id="pr-pa" min="0" max="100" value="30" step="1">
                            <span class="param-value" id="val-pr-pa">0.30</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-pb">pb</label>
                            <input type="range" id="pr-pb" min="0" max="100" value="30" step="1">
                            <span class="param-value" id="val-pr-pb">0.30</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-pc">pc</label>
                            <input type="range" id="pr-pc" min="1" max="6" value="2" step="1">
                            <span class="param-value" id="val-pr-pc">2</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-pd">pd</label>
                            <input type="range" id="pr-pd" min="0" max="100" value="50" step="1">
                            <span class="param-value" id="val-pr-pd">0.50</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-depth">Depth</label>
                            <input type="range" id="pr-depth" min="1" max="10" value="7" step="1">
                            <span class="param-value" id="val-pr-depth">7</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-branches">Branches</label>
                            <input type="range" id="pr-branches" min="2" max="12" value="5" step="1">
                            <span class="param-value" id="val-pr-branches">5</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-radius">Radius</label>
                            <input type="range" id="pr-radius" min="1" max="100" value="15" step="1">
                            <span class="param-value" id="val-pr-radius">0.15</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-id">ID value</label>
                            <input type="range" id="pr-id" min="1" max="1000" value="500" step="1">
                            <span class="param-value" id="val-pr-id">0.50</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-cell">Cell scale</label>
                            <input type="range" id="pr-cell" min="20" max="100" value="65" step="1">
                            <span class="param-value" id="val-pr-cell">65%</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-zoom">Zoom</label>
                            <input type="range" id="pr-zoom" min="50" max="300" value="150" step="5">
                            <span class="param-value" id="val-pr-zoom">1.50x</span>
                        </div>
                    </section>

                    <section class="control-section">
                        <h3>Animation</h3>
                        <div class="control-row">
                            <label for="pr-animate">Animate</label>
                            <input type="checkbox" id="pr-animate" checked>
                        </div>
                        <div class="control-row">
                            <label for="pr-motion">Motion</label>
                            <input type="range" id="pr-motion" min="0" max="100" value="20" step="1">
                            <span class="param-value" id="val-pr-motion">0.20</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-rot-freq">Rot freq</label>
                            <input type="range" id="pr-rot-freq" min="10" max="300" value="132" step="1">
                            <span class="param-value" id="val-pr-rot-freq">13.2</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-rad-freq">Rad freq</label>
                            <input type="range" id="pr-rad-freq" min="10" max="400" value="334" step="1">
                            <span class="param-value" id="val-pr-rad-freq">33.4</span>
                        </div>
                    </section>

                    <section class="control-section">
                        <h3>Branching & color</h3>
                        <div class="control-row">
                            <label for="pr-b1">Branch A</label>
                            <input type="range" id="pr-b1" min="1" max="100" value="50" step="1">
                            <span class="param-value" id="val-pr-b1">0.50</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-b2">Branch B</label>
                            <input type="range" id="pr-b2" min="1" max="100" value="50" step="1">
                            <span class="param-value" id="val-pr-b2">0.50</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-b3">Branch C</label>
                            <input type="range" id="pr-b3" min="1" max="100" value="60" step="1">
                            <span class="param-value" id="val-pr-b3">0.60</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-hue-start">Hue start</label>
                            <input type="range" id="pr-hue-start" min="0" max="360" value="0" step="1">
                            <span class="param-value" id="val-pr-hue-start">0°</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-hue-end">Hue end</label>
                            <input type="range" id="pr-hue-end" min="0" max="360" value="360" step="1">
                            <span class="param-value" id="val-pr-hue-end">360°</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-sat">Saturation</label>
                            <input type="range" id="pr-sat" min="0" max="100" value="100" step="1">
                            <span class="param-value" id="val-pr-sat">100</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-bright">Brightness</label>
                            <input type="range" id="pr-bright" min="0" max="200" value="100" step="1">
                            <span class="param-value" id="val-pr-bright">100%</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-alpha">Alpha</label>
                            <input type="range" id="pr-alpha" min="1" max="100" value="50" step="1">
                            <span class="param-value" id="val-pr-alpha">0.50</span>
                        </div>
                        <div class="control-row">
                            <label for="pr-stroke-mode">Stroke mode</label>
                            <select id="pr-stroke-mode" class="select-input">
                                <option value="auto" selected>Auto</option>
                                <option value="fill">Fill</option>
                                <option value="stroke">Stroke</option>
                            </select>
                        </div>
                        <div class="control-row">
                            <label for="pr-stroke-width">Stroke width</label>
                            <input type="range" id="pr-stroke-width" min="1" max="12" value="1" step="1">
                            <span class="param-value" id="val-pr-stroke-width">1</span>
                        </div>
                    </section>
                </div>
            </aside>
        </div>
    </div>
    <script src="page-transition.js"></script>
    <script src="particles.js"></script>
</body>
</html>
