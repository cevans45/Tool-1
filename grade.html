<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade — OVRT</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="site-shell">
        <header class="tool-header">
            <a href="index.html" class="back-link">← Back to OVRT</a>
            <span class="tool-title">Grade</span>
        </header>

        <div class="app" aria-label="Grade">
            <div id="sketch-container">
                <canvas id="canvas"></canvas>
            </div>

            <aside class="control-panel">
                <header class="panel-header">
                    <h2>Controls</h2>
                </header>

                <div class="panel-body">
                    <details class="control-window" open>
                        <summary>Grid pad</summary>
                        <section class="control-section">

                            <div class="control-row" style="margin-bottom:12px;">
                                <div class="mode-switch" style="width:100%; margin:0;">
                                    <button type="button" id="gr-mode-draw" class="panel-button is-active">DRAW</button>
                                    <button type="button" id="gr-mode-erase" class="panel-button">ERASE</button>
                                </div>
                            </div>

                            <div class="control-row">
                                <label for="gr-grid-type">Grid type</label>
                                <select id="gr-grid-type" class="select-input">
                                    <option value="square" selected>Square</option>
                                    <option value="honeycomb">Honeycomb</option>
                                    <option value="brick">Brick</option>
                                    <option value="diamond">Diamond</option>
                                    <option value="dot">Dot</option>
                                </select>
                            </div>

                            <div class="control-row">
                                <label for="gr-size">Grid size</label>
                                <input type="range" id="gr-size" min="4" max="20" value="8" step="1">
                                <span class="param-value" id="val-gr-size">8</span>
                            </div>

                            <div class="control-row">
                                <label for="gr-gap">Cell gap</label>
                                <input type="range" id="gr-gap" min="0" max="8" value="2" step="0.5">
                                <span class="param-value" id="val-gr-gap">2</span>
                            </div>

                            <div class="control-row">
                                <label for="gr-sink">Sink depth</label>
                                <input type="range" id="gr-sink" min="0" max="10" value="5" step="0.5">
                                <span class="param-value" id="val-gr-sink">5</span>
                            </div>

                            <label class="checkbox-label">
                                <input type="checkbox" id="gr-show-grid" checked>
                                <span class="toggle-box"></span>
                                <span class="cb-label">Show grid lines</span>
                            </label>

                            <div class="control-row color-row">
                                <label for="gr-ink-color">Ink color</label>
                                <input type="color" id="gr-ink-color" value="#000000">
                            </div>
                            <div class="control-row color-row">
                                <label for="gr-bg-color">Background</label>
                                <input type="color" id="gr-bg-color" value="#ffffff">
                            </div>
                            <div class="control-row color-row">
                                <label for="gr-grid-color">Grid color</label>
                                <input type="color" id="gr-grid-color" value="#cccccc">
                            </div>

                            <div class="control-row" style="gap:6px; margin-top:8px;">
                                <button type="button" id="gr-clear" class="panel-button">Clear</button>
                            </div>

                            <div class="shortcuts">
                                <span>[SPACE]</span> CLEAR<br>
                                <span>[⌘Z]</span> UNDO
                            </div>
                        </section>
                    </details>
                </div>
            </aside>
        </div>
    </div>

    <style>
        .app[aria-label="Grade"] {
            height: calc(100vh - 56px);
            min-height: calc(100vh - 56px);
            padding: 0;
            gap: 0;
            align-items: stretch;
            justify-content: flex-start;
        }

        .app[aria-label="Grade"] #sketch-container {
            flex: 1;
            height: 100%;
            width: 100%;
            min-width: 0;
            pointer-events: auto;
        }

        .app[aria-label="Grade"] #sketch-container canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        .app[aria-label="Grade"] .control-panel {
            width: 280px;
        }

        .app[aria-label="Grade"] .control-row {
            gap: 8px;
        }

        .app[aria-label="Grade"] .control-row label {
            flex: 0 0 90px;
        }

        .app[aria-label="Grade"] .panel-body {
            max-height: none;
        }
    </style>

    <script src="page-transition.js"></script>
    <script>
        if (new URLSearchParams(window.location.search).get('preview') === '1') {
            document.body.classList.add('is-preview');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let cssWidth = 1;
        let cssHeight = 1;
        let dpr = 1;

        const $ = (id) => document.getElementById(id);

        const state = {
            gridType: 'square',
            gridSize: 8,
            gap: 2,
            sinkDepth: 5,
            showGrid: true,
            mode: 'draw',
            inkColor: '#000000',
            bgColor: '#ffffff',
            gridColor: '#cccccc',
            filled: new Set(),
            hoverCellId: null,
            isDrawing: false,
            undoStack: [],
            gridCells: [],
            gridLookup: new Map(),
        };

        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

        // ─── Grid Builders ────────────────────────────────────────────
        // Each returns an array of { id, row, col, cx, cy, path, radius }

        function buildSquareCells(cols, w, h) {
            const gap = state.gap;
            const cellW = w / cols;
            const rows = Math.ceil(h / cellW);
            const cells = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW;
                    const y = r * cellW;
                    const inset = gap / 2;
                    const path = new Path2D();
                    path.rect(x + inset, y + inset, cellW - gap, cellW - gap);
                    cells.push({
                        id: r + '_' + c, row: r, col: c,
                        cx: x + cellW / 2, cy: y + cellW / 2,
                        path, radius: cellW / 2 - inset,
                        x: x + inset, y: y + inset,
                        w: cellW - gap, h: cellW - gap,
                    });
                }
            }
            return cells;
        }

        function buildHoneycombCells(cols, w, h) {
            const gap = state.gap;
            const size = w / (cols * 1.5 + 0.5);
            const hexH = size * Math.sqrt(3);
            const rows = Math.ceil(h / hexH) + 1;
            const cells = [];
            for (let r = 0; r < rows; r++) {
                const rowCols = (r % 2 === 0) ? cols : cols + 1;
                for (let c = 0; c < rowCols; c++) {
                    const cx = c * size * 1.5 + size;
                    const cy = r * hexH + hexH / 2;
                    if (r % 2 === 1) {
                        var cxOff = cx - size * 0.75;
                    } else {
                        var cxOff = cx;
                    }
                    const insetFrac = clamp(gap / (size * 2), 0, 0.4);
                    const innerSize = size * (1 - insetFrac);
                    const path = new Path2D();
                    for (let i = 0; i < 6; i++) {
                        const angle = Math.PI / 3 * i;
                        const vx = cxOff + innerSize * Math.cos(angle);
                        const vy = cy + innerSize * Math.sin(angle);
                        if (i === 0) path.moveTo(vx, vy);
                        else path.lineTo(vx, vy);
                    }
                    path.closePath();
                    cells.push({
                        id: r + '_' + c, row: r, col: c,
                        cx: cxOff, cy,
                        path, radius: innerSize,
                    });
                }
            }
            return cells;
        }

        function buildBrickCells(cols, w, h) {
            const gap = state.gap;
            const cellW = w / cols;
            const cellH = cellW * 0.5;
            const rows = Math.ceil(h / cellH);
            const cells = [];
            for (let r = 0; r < rows; r++) {
                const offset = (r % 2 === 1) ? cellW / 2 : 0;
                const rowCols = (r % 2 === 1) ? cols + 1 : cols;
                for (let c = 0; c < rowCols; c++) {
                    const x = c * cellW - offset;
                    const y = r * cellH;
                    const inset = gap / 2;
                    const path = new Path2D();
                    const rx = Math.max(x, 0);
                    const ry = y;
                    const rw = Math.min(x + cellW, w) - rx;
                    if (rw <= gap) continue;
                    path.rect(rx + inset, ry + inset,
                        Math.min(cellW - gap, rw - gap), cellH - gap);
                    cells.push({
                        id: r + '_' + c, row: r, col: c,
                        cx: x + cellW / 2, cy: y + cellH / 2,
                        path, radius: Math.min(cellW, cellH) / 2,
                        x: rx + inset, y: ry + inset,
                        w: Math.min(cellW - gap, rw - gap), h: cellH - gap,
                    });
                }
            }
            return cells;
        }

        function buildDiamondCells(cols, w, h) {
            const gap = state.gap;
            const cellW = w / cols;
            const halfW = cellW / 2;
            const halfH = halfW;
            const rows = Math.ceil(h / halfH) + 1;
            const cells = [];
            const insetFrac = clamp(gap / cellW, 0, 0.4);
            const iw = halfW * (1 - insetFrac);
            const ih = halfH * (1 - insetFrac);
            for (let r = 0; r < rows; r++) {
                const offset = (r % 2 === 1) ? halfW : 0;
                for (let c = 0; c < cols; c++) {
                    const cx = c * cellW + halfW + offset;
                    const cy = r * halfH + halfH;
                    if (cx - halfW > w || cy - halfH > h) continue;
                    const path = new Path2D();
                    path.moveTo(cx, cy - ih);
                    path.lineTo(cx + iw, cy);
                    path.lineTo(cx, cy + ih);
                    path.lineTo(cx - iw, cy);
                    path.closePath();
                    cells.push({
                        id: r + '_' + c, row: r, col: c,
                        cx, cy, path, radius: iw,
                    });
                }
            }
            return cells;
        }

        function buildDotCells(cols, w, h) {
            const gap = state.gap;
            const cellW = w / cols;
            const rows = Math.ceil(h / cellW);
            const r0 = (cellW - gap) / 2 * 0.92;
            const cells = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cx = c * cellW + cellW / 2;
                    const cy = r * cellW + cellW / 2;
                    const path = new Path2D();
                    path.arc(cx, cy, Math.max(1, r0), 0, Math.PI * 2);
                    cells.push({
                        id: r + '_' + c, row: r, col: c,
                        cx, cy, path, radius: r0,
                    });
                }
            }
            return cells;
        }

        // ─── Grid rebuild ─────────────────────────────────────────────

        function rebuildGrid() {
            const w = cssWidth;
            const h = cssHeight;
            const cols = state.gridSize;
            switch (state.gridType) {
                case 'square':    state.gridCells = buildSquareCells(cols, w, h); break;
                case 'honeycomb': state.gridCells = buildHoneycombCells(cols, w, h); break;
                case 'brick':     state.gridCells = buildBrickCells(cols, w, h); break;
                case 'diamond':   state.gridCells = buildDiamondCells(cols, w, h); break;
                case 'dot':       state.gridCells = buildDotCells(cols, w, h); break;
                default:          state.gridCells = buildSquareCells(cols, w, h);
            }
            state.gridLookup.clear();
            for (const cell of state.gridCells) {
                state.gridLookup.set(cell.id, cell);
            }
        }

        // ─── Hit testing ──────────────────────────────────────────────

        function getCellAt(x, y) {
            let best = null;
            let bestDist = Infinity;
            for (const cell of state.gridCells) {
                const dx = x - cell.cx;
                const dy = y - cell.cy;
                const d = dx * dx + dy * dy;
                if (d < bestDist && d < cell.radius * cell.radius * 2.5) {
                    if (ctx.isPointInPath(cell.path, x * dpr, y * dpr)) {
                        best = cell;
                        bestDist = d;
                    }
                }
            }
            return best;
        }

        // ─── Rendering ───────────────────────────────────────────────

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.fillStyle = state.bgColor;
            ctx.fillRect(0, 0, cssWidth, cssHeight);

            const depth = state.sinkDepth / 10;

            for (const cell of state.gridCells) {
                const isFilled = state.filled.has(cell.id);
                const isHover = cell.id === state.hoverCellId && !isFilled;

                if (isFilled) {
                    ctx.fillStyle = state.inkColor;
                    ctx.fill(cell.path);

                    if (depth > 0) {
                        ctx.save();
                        ctx.clip(cell.path);
                        const grad = ctx.createRadialGradient(
                            cell.cx - cell.radius * 0.2,
                            cell.cy - cell.radius * 0.2,
                            cell.radius * 0.1,
                            cell.cx, cell.cy,
                            cell.radius * 1.1
                        );
                        grad.addColorStop(0, 'rgba(255,255,255,' + (depth * 0.12) + ')');
                        grad.addColorStop(0.45, 'rgba(0,0,0,0)');
                        grad.addColorStop(1, 'rgba(0,0,0,' + (depth * 0.3) + ')');
                        ctx.fillStyle = grad;
                        ctx.fill(cell.path);
                        ctx.restore();
                    }
                } else if (isHover) {
                    const r = parseInt(state.inkColor.slice(1, 3), 16);
                    const g = parseInt(state.inkColor.slice(3, 5), 16);
                    const b = parseInt(state.inkColor.slice(5, 7), 16);
                    ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',0.15)';
                    ctx.fill(cell.path);
                }

                if (state.showGrid) {
                    ctx.strokeStyle = state.gridColor;
                    ctx.lineWidth = 1;
                    ctx.stroke(cell.path);
                }
            }
        }

        // ─── Interaction ─────────────────────────────────────────────

        function canvasCoordsFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const c = e.touches ? e.touches[0] : e;
            return { x: c.clientX - rect.left, y: c.clientY - rect.top };
        }

        function pushUndo() {
            state.undoStack.push(new Set(state.filled));
            if (state.undoStack.length > 40) state.undoStack.shift();
        }

        function undo() {
            if (!state.undoStack.length) return;
            state.filled = state.undoStack.pop();
            render();
        }

        function handlePointerDown(e) {
            state.isDrawing = true;
            pushUndo();
            const p = canvasCoordsFromEvent(e);
            const cell = getCellAt(p.x, p.y);
            if (cell) {
                if (state.mode === 'draw') state.filled.add(cell.id);
                else state.filled.delete(cell.id);
                render();
            }
        }

        function handlePointerMove(e) {
            const p = canvasCoordsFromEvent(e);
            const cell = getCellAt(p.x, p.y);
            const newId = cell ? cell.id : null;

            if (state.isDrawing && cell) {
                if (state.mode === 'draw') state.filled.add(cell.id);
                else state.filled.delete(cell.id);
            }

            if (newId !== state.hoverCellId) {
                state.hoverCellId = newId;
            }
            render();
        }

        function handlePointerUp() {
            state.isDrawing = false;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', () => {
            state.hoverCellId = null;
            render();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePointerDown(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointerMove(e);
        }, { passive: false });
        canvas.addEventListener('touchend', handlePointerUp);
        canvas.addEventListener('touchcancel', handlePointerUp);

        // ─── Resize ──────────────────────────────────────────────────

        function resize() {
            const container = document.getElementById('sketch-container');
            const rect = container.getBoundingClientRect();
            let w = rect.width;
            let h = rect.height;
            if (!Number.isFinite(w) || w < 10) w = window.innerWidth;
            if (!Number.isFinite(h) || h < 10) h = window.innerHeight;

            cssWidth = w;
            cssHeight = h;
            dpr = Math.max(1, window.devicePixelRatio || 1);

            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);

            rebuildGrid();
            render();
        }

        window.addEventListener('resize', () => requestAnimationFrame(resize));

        // ─── Clear / Export ──────────────────────────────────────────

        function clearAll() {
            state.filled.clear();
            state.undoStack = [];
            render();
        }

        function exportPNG() {
            const out = document.createElement('canvas');
            out.width = canvas.width;
            out.height = canvas.height;
            const oc = out.getContext('2d');
            oc.drawImage(canvas, 0, 0);
            const link = document.createElement('a');
            link.download = 'grade_grid.png';
            link.href = out.toDataURL('image/png');
            link.click();
        }
        window.exportPagePNG = exportPNG;

        // ─── UI Wiring ──────────────────────────────────────────────

        const drawBtn = $('gr-mode-draw');
        const eraseBtn = $('gr-mode-erase');
        drawBtn.addEventListener('click', () => {
            state.mode = 'draw';
            drawBtn.classList.add('is-active');
            eraseBtn.classList.remove('is-active');
        });
        eraseBtn.addEventListener('click', () => {
            state.mode = 'erase';
            eraseBtn.classList.add('is-active');
            drawBtn.classList.remove('is-active');
        });

        $('gr-grid-type').addEventListener('change', (e) => {
            state.gridType = e.target.value;
            rebuildGrid();
            render();
        });

        $('gr-size').addEventListener('input', (e) => {
            state.gridSize = parseInt(e.target.value, 10);
            $('val-gr-size').textContent = state.gridSize;
            state.filled.clear();
            rebuildGrid();
            render();
        });

        $('gr-gap').addEventListener('input', (e) => {
            state.gap = parseFloat(e.target.value);
            $('val-gr-gap').textContent = state.gap % 1 === 0 ? String(state.gap) : state.gap.toFixed(1);
            rebuildGrid();
            render();
        });

        $('gr-sink').addEventListener('input', (e) => {
            state.sinkDepth = parseFloat(e.target.value);
            $('val-gr-sink').textContent = state.sinkDepth % 1 === 0 ? String(state.sinkDepth) : state.sinkDepth.toFixed(1);
            render();
        });

        $('gr-show-grid').addEventListener('change', (e) => {
            state.showGrid = e.target.checked;
            render();
        });

        $('gr-ink-color').addEventListener('input', (e) => {
            state.inkColor = e.target.value;
            render();
        });

        $('gr-bg-color').addEventListener('input', (e) => {
            state.bgColor = e.target.value;
            const app = document.querySelector('.app[aria-label="Grade"]');
            if (app) app.style.backgroundColor = state.bgColor;
            render();
        });

        $('gr-grid-color').addEventListener('input', (e) => {
            state.gridColor = e.target.value;
            render();
        });

        $('gr-clear').addEventListener('click', clearAll);
        window.addEventListener('keydown', (e) => {
            const key = (e.key || '').toLowerCase();
            if ((e.metaKey || e.ctrlKey) && key === 'z') {
                e.preventDefault();
                undo();
                return;
            }
            if (e.code === 'Space') {
                e.preventDefault();
                clearAll();
            }
        });

        // ─── Init ────────────────────────────────────────────────────

        const app = document.querySelector('.app[aria-label="Grade"]');
        if (app) app.style.backgroundColor = state.bgColor;

        resize();
        requestAnimationFrame(resize);
    </script>
</body>

</html>
